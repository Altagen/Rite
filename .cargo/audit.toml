# cargo-audit configuration.
#
# An entry here silences an advisory for the whole dependency graph, so each one
# has to say what is being accepted and what would end it. An entry kept past its
# fix is worse than no entry at all: it would hide the same advisory if a future
# dependency pulled the vulnerable version back in.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 — Marvin Attack: key recovery through timing sidechannels in `rsa`.
  #
  # No fixed version exists in any published release of the crate, so this is not a
  # bump we are postponing. It arrives through russh -> rsa 0.10.0-rc.18 (also via
  # ssh-key), and an SSH client cannot drop RSA without refusing RSA host and user
  # keys. The attack needs an adaptive oracle over RSA *decryption* padding, which
  # the signature path SSH uses does not expose, so the practical reach here is thin.
  #
  # It used to be reported twice, the second hit being rsa 0.9.10 under sqlx-mysql —
  # a driver we never enable, pulled in by sqlx's default features. Pruning those
  # features took that one out of the lockfile, so only the reachable hit remains.
  #
  # Drop this entry once `rsa` ships a release that closes it.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2024-0429 — unsoundness in glib::VariantStrIter.
  #
  # Iterating a GVariant string array dereferences a NULL pointer, so the impact is
  # a crash rather than a disclosure. Rite never calls glib itself; it arrives
  # transitively through wry -> webkit2gtk/gtk -> glib 0.18.
  #
  # Unfixable from here, not merely unfixed: the patch is in glib 0.20, which belongs
  # to the GTK4 line, while wry and tao bind GTK3 through the `gtk` crate — upstream
  # marks it UNMAINTAINED at 0.19 and points at gtk4. wry 0.57 and tao 0.37 are both
  # the latest published versions, so there is no newer release to move to.
  #
  # Drop this entry when wry/tao bind GTK4 and glib reaches 0.20 in the lockfile.
  "RUSTSEC-2024-0429",

  # RUSTSEC-2026-0459 — CVE-2026-119375, uninitialised page-cache memory out of SQLite.
  #
  # SQLite before 3.54.0 can hand back stale bytes from the process when it opens a
  # database alongside a sibling `-wal` whose page size differs from the database's.
  # The advisory names the vector itself: local, and the victim must open the files —
  # "only a process that opens a database and WAL that a less trusted party could have
  # written is exposed".
  #
  # The C is COMPILED IN, not linked: `ldd` on rite-server shows no libsqlite3.so, so no
  # operating-system patch reaches it, and Rite runs in WAL mode so the sibling exists.
  # What is absent is the untrusted file. The path is fixed and Rite chose it,
  # `dirs::data_dir()/rite/vault.db`; nothing anywhere opens a database somebody else
  # wrote, and every statement is Rite's own and parameterised. Planting that pair means
  # already being able to write the directory the vault lives in.
  #
  # Unfixable from here rather than merely unfixed: the correction is libsqlite3-sys
  # 0.39.0 and sqlx-sqlite 0.9.0 will not go past 0.37 — `cargo update -p
  # libsqlite3-sys` reaches 0.37.0 and stops, which answers nothing.
  #
  # Drop this entry when sqlx allows libsqlite3-sys >= 0.39 — OR SOONER, if Rite ever
  # grows a path that opens a database file the user did not create: importing one,
  # attaching a second vault, a file picker. That is the condition to watch, because it
  # is a feature somebody could add without ever reading this file.
  # `e2e/advisory-floor-check.mjs` carries the same decision where a reader looking for
  # decisions would find it.
  "RUSTSEC-2026-0459",
]
