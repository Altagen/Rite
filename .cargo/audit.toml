# cargo-audit configuration.
#
# An entry here silences an advisory for the whole dependency graph, so each one
# has to say what is being accepted and what would end it. An entry kept past its
# fix is worse than no entry at all: it would hide the same advisory if a future
# dependency pulled the vulnerable version back in.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 — Marvin Attack: key recovery through timing sidechannels in `rsa`.
  #
  # No fixed version exists in any published release of the crate, so this is not a
  # bump we are postponing. It arrives through russh -> rsa 0.10.0-rc.18 (also via
  # ssh-key), and an SSH client cannot drop RSA without refusing RSA host and user
  # keys. The attack needs an adaptive oracle over RSA *decryption* padding, which
  # the signature path SSH uses does not expose, so the practical reach here is thin.
  #
  # cargo-audit reports this twice because it reads Cargo.lock rather than the build
  # graph: the second hit, rsa 0.9.10 under sqlx-mysql, is a lockfile entry for a
  # driver we never enable — `cargo tree -i rsa@0.9.10 --target all` finds no path to
  # it, and nothing compiles it.
  #
  # Drop this entry once `rsa` ships a release that closes it.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2024-0429 — unsoundness in glib::VariantStrIter.
  #
  # Iterating a GVariant string array dereferences a NULL pointer, so the impact is
  # a crash rather than a disclosure. Rite never calls glib itself; it arrives
  # transitively through wry -> webkit2gtk/gtk -> glib 0.18.
  #
  # Unfixable from here, not merely unfixed: the patch is in glib 0.20, which belongs
  # to the GTK4 line, while wry and tao bind GTK3 through the `gtk` crate — upstream
  # marks it UNMAINTAINED at 0.19 and points at gtk4. wry 0.57 and tao 0.37 are both
  # the latest published versions, so there is no newer release to move to.
  #
  # Drop this entry when wry/tao bind GTK4 and glib reaches 0.20 in the lockfile.
  "RUSTSEC-2024-0429",
]
