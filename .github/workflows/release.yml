name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  # Create draft release with changelog
  create-release:
    name: 📋 Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: changelog.md

      # What ships is not only what the changelog lists. The server image goes to
      # GHCR, which is not a release asset and so appears nowhere on this page
      # unless we say so, and the checksums are worth nothing if nobody is told
      # how to use them. Prepended, so it survives however the changelog turns out.
      - name: Prepend the install header to the notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rite-server"
          {
            echo "## Install"
            echo
            echo "**Desktop client** — download the tarball for your platform below, then:"
            echo
            echo '```bash'
            echo "tar -xzf rite-${VERSION}-linux-x86_64.tar.gz && ./rite"
            echo '```'
            echo
            echo "**Server** — a multi-arch image (linux/amd64, linux/arm64):"
            echo
            echo '```bash'
            echo "podman pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "**Verify a download** against \`rite-${VERSION}-checksums.txt\`:"
            echo
            echo '```bash'
            echo "sha256sum -c --ignore-missing rite-${VERSION}-checksums.txt"
            echo '```'
            echo
            echo "\`sbom-${VERSION}.json\` is the CycloneDX bill of materials for the client."
            echo
            echo "---"
            echo
            cat changelog.md
          } > notes.md
          mv notes.md changelog.md
          cat changelog.md

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RITE ${{ steps.version.outputs.version }}
          body_path: changelog.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the wry desktop client (raw binary + embedded frontend) per platform
  build-client:
    name: 🔨 Client (${{ matrix.platform.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      # wry needs WebKitGTK + GTK at build and run time on Linux.
      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      - name: Install pnpm dependencies
        run: pnpm install

      # The client runs rite-server in-process and serves the embedded frontend,
      # so the built frontend must be embedded before compiling (rust-embed).
      - name: Build and embed frontend
        run: |
          pnpm --filter desktop build:frontend
          cp -r apps/desktop/dist/. packages/rite-server/web/

      - name: Build client binary
        run: cargo build --release -p rite-desktop --target ${{ matrix.platform.target }}

      - name: Package artifact
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          PLATFORM=$([[ "${{ matrix.platform.os }}" == ubuntu* ]] && echo linux || echo macos)
          ARCH="${{ matrix.platform.arch }}"
          mkdir -p dist
          BINARY="target/${{ matrix.platform.target }}/release/rite"
          tar -czf "dist/rite-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" -C "$(dirname "$BINARY")" rite
          echo "Artifacts:"; ls -lh dist/

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          for file in *; do
            [ -f "$file" ] && sha256sum "$file" >> "../checksums-${{ matrix.platform.target }}.txt"
          done

      - name: Upload checksums as artifact
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ matrix.platform.target }}
          path: checksums-${{ matrix.platform.target }}.txt

      # draft: true or this step republishes the release as public the moment the
      # first platform finishes. That is how 0.2.0 went out while its Finalize job
      # was still to fail — published, with no SBOM and no checksums, and the
      # publish job skipped behind the failure. The release stays a draft until
      # the publish job says otherwise.
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push the multi-arch rite-server image to GHCR
  build-server-image:
    name: 🐳 Server image
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Compute image name (lowercased)
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rite-server" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ needs.create-release.outputs.version }}
            ${{ steps.img.outputs.image }}:latest

  # Generate SBOM and consolidated checksums
  finalize:
    name: 📦 Finalize Release
    needs: [create-release, build-client, build-server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned: an unpinned `cargo install` is what broke the 0.2.0 release — the
      # newest cargo-cyclonedx that day had dropped the flag this job was using.
      # A build tool in the release path has no business floating.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx@0.5.9 --locked

      # cargo-cyclonedx dropped `-p/--package`; the crate is selected by its manifest.
      - name: Generate SBOM (client)
        run: cargo cyclonedx --format json --manifest-path apps/desktop/shell/Cargo.toml

      - name: Rename SBOM
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          mv "$(find . -name 'rite-desktop*.cdx.json' | head -1)" "sbom-${VERSION}.json"

      - name: Download checksum artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true

      - name: Create consolidated checksums file
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cat checksums/*.txt > "rite-${VERSION}-checksums.txt"
          cat "rite-${VERSION}-checksums.txt"

      - name: Upload SBOM and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sbom-${{ needs.create-release.outputs.version }}.json
            rite-${{ needs.create-release.outputs.version }}-checksums.txt
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish release (remove draft status)
  publish:
    name: 🚀 Publish Release
    needs: [create-release, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
