# The two base images, built on a clock rather than on a commit.
#
#   toolchain — what every CI job that compiles anything runs IN
#   runtime    — what the shipped server runs ON (the third stage of Containerfile.server)
#
# WHY IT IS NOT BUILT BY CI. Four jobs used to run `apt-get install` on a bare runner.
# On 2026-11-19 archive.ubuntu.com stopped answering — `connection timed out` — and the
# same package list took 23s in one job and 34m12s in another on the same run. Thirteen
# jobs, each holding its own lottery ticket against a server that is not ours. Here, apt
# runs once a week in one job, and a bad day fails nothing but this.
#
# WHY IT IS ON A CLOCK AND NOT ONLY ON DEMAND. An image built once and pinned forever is
# a base that stops receiving security updates — "no apt in CI" and "patched" pull against
# each other, and the schedule is what settles it. Weekly: `apt-get` runs, the base comes
# back patched, and a new digest is published whether or not anyone thought about it.
#
# WHAT IT PUBLISHES IS A DIGEST. `.github/toolchain-image` pins `@sha256:…`, not a tag: a
# tag can be moved under us by anyone who can push to the registry, a digest cannot, and
# it is also what makes "which environment built this binary" a question with an answer.
# Updating is one line in that file — and the run below prints exactly what to put there.
name: Base images

on:
  # The four files the image is made of. Change one and the image is stale by definition.
  #
  # develop AND NOTHING ELSE. The tag is the hash of the recipe, so two branches holding
  # the same recipe produce the same tag on the same day — and the second push republishes
  # it. If the bytes differ by so much as an apt mirror's mood, the first manifest is
  # untagged, GHCR collects it, and every pinned digest stops resolving at once. A release
  # merge into `main` is precisely that case: the same Containerfile, hours later.
  #
  # So one branch publishes. A feature branch that changes the recipe gets its image when
  # it reaches develop; before that, `ci-image-check` fails on it, which is the mechanism
  # working, and `workflow_dispatch` is there for anyone who needs the image sooner.
  push:
    branches:
      - develop
    paths:
      - 'Containerfile'
      - 'Containerfile.runtime'
      - 'rust-toolchain.toml'
      - '.node-version'
      - 'package.json'
      - '.github/workflows/base-images.yml'
  # Monday, early. One line to change if weekly turns out to be the wrong cadence.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One at a time. The job below force-pushes a fixed branch; two runs doing that at once
# would leave the pull request pointing at whichever finished last, with no way to tell.
# Queued rather than cancelled: a run that already pushed an image must still say so.
concurrency:
  group: base-images
  cancel-in-progress: false

jobs:
  toolchain:
    name: 📦 Toolchain image
    runs-on: ubuntu-26.04
    # Tag AND digest, in the one shape `.github/toolchain-image` accepts.
    outputs:
      pin: ${{ steps.say.outputs.pin }}
    steps:
      # THE RECIPE THE PIN WILL SIT NEXT TO, which on a scheduled run is not the one
      # checked out by default. A `schedule` fires from the default branch, so `main` is
      # what lands here — and between two releases `main`'s Containerfile is not develop's.
      # The tag is the hash of that file, and the pin goes to develop, so building from
      # main would open a pull request whose own `ci-image-check` fails: the pin names one
      # hash, develop's files hash to another. A dispatch keeps the branch it was asked
      # from; a push is already restricted to develop.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      # The tag is the hash of what goes into the image, so an unchanged toolchain keeps
      # its tag and a changed one cannot reuse it.
      #
      # `package.json` counts BY ONE LINE. The image reads `packageManager` from it; the
      # file also carries the release number, so hashing all of it would publish a new
      # image on every version bump — an image per release, which is the thing this
      # design exists to avoid. Invisible until a release, which is why it is written down.
      # A TAG IS NEVER REUSED, and this is the correction that matters most here.
      #
      # Pushing the same tag twice makes the previous manifest untagged, and GHCR collects
      # it — so the digest pinned in `.github/toolchain-image` stopped resolving and every
      # job that runs in this image failed at once. That was not an accident waiting to
      # happen, it was scheduled: the Monday rebuild would have done it every week, by
      # design, through the mechanism meant to make this reliable.
      #
      # So every publish carries its own date: `<hash>-<YYYYMMDD>` is immutable, and the
      # pin keeps resolving until someone deliberately moves it. `<hash>` is pushed too, as
      # a convenience pointer for a human reading the registry — nothing pins it.
      - name: Compute the tag from what the image is made of
        id: tag
        run: |
          set -eu
          hash="$( { cat Containerfile rust-toolchain.toml .node-version; \
                     sed -n 's/.*"packageManager" *: *"\([^"]*\)".*/\1/p' package.json; } \
                   | sha256sum | cut -c1-12 )"
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rite-ci"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "ref=$image:$hash-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "moving=$image:$hash" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # A scheduled run REBUILDS even when the tag exists: that is the whole point of the
      # schedule — same recipe, newer packages, new digest. A push that changed nothing
      # relevant would otherwise rebuild for nothing, so only the clock forces it.
      # A TAG IS NEVER REPUBLISHED, and two runs can legitimately land on the same one:
      # the Monday rebuild publishes `<hash>-<today>`, and a push to develop hours later
      # computes the very same tag from the very same recipe. Pushing it again with bytes
      # that differ — one apt mirror having moved on is enough — untags the first
      # manifest, GHCR collects it, and every digest pinned to it stops resolving.
      #
      # So the second run does not build. It reads the digest already published under that
      # tag and reports it, which is the correct pin anyway: that image IS this recipe.
      # The clock is exempt because it is what produces the day's bytes in the first place.
      - name: Is it already published?
        id: known
        if: github.event_name != 'schedule'
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -eu
          if digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$REF" 2>/dev/null)"; then
            echo "already=$digest" >> "$GITHUB_OUTPUT"
            echo "$REF is already published at $digest — not rebuilding it"
          else
            echo "$REF is not in the registry yet"
          fi

      - name: Build and push
        id: build
        if: steps.known.outputs.already == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.tag.outputs.ref }}
            ${{ steps.tag.outputs.moving }}

      # REPORTS, DOES NOT GATE, and that is a decision rather than an omission. A build
      # image legitimately carries development libraries with open advisories; a weekly
      # gate that cries wolf is a weekly gate nobody reads. `ignore-unfixed` keeps what is
      # actionable — an advisory with a fix available means the rebuild above did not take
      # it. Turn `exit-code` to 1 once a few weeks of this output say what normal looks like.
      # `continue-on-error` for the same reason it reports rather than gates: the scanner
      # downloads its own database, and an outage there must not stop the image from being
      # published. A step that cannot fail anything should not be able to fail the job.
      - name: Scan it
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      # ONE PLACE COMPUTES THE PIN and the job hands out what it computed, rather than
      # the same expression written twice and drifting once. Empty is a failure, not a
      # blank line: it would mean neither the build nor the registry produced a digest.
      - name: Say what to pin
        id: say
        env:
          REF: ${{ steps.tag.outputs.ref }}
          # The build's digest, or the one already published under this tag.
          DIGEST: ${{ steps.build.outputs.digest || steps.known.outputs.already }}
        run: |
          set -eu
          if [ -z "$DIGEST" ]; then
            echo "::error::no digest — the image was neither built nor found in the registry" >&2
            exit 1
          fi
          # TAG AND DIGEST, which is what `.github/toolchain-image` must carry: the digest
          # is pulled, the tag is the hash `ci-image-check` recomputes. Printing only the
          # digest would hand over a line that fails the check it is meant to satisfy.
          digest="$REF@$DIGEST"
          echo "pin=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '## The toolchain image this run published'
            echo
            echo '```'
            echo "$digest"
            echo '```'
            echo
            echo 'Put that line in `.github/toolchain-image` to make CI use it.'
            echo 'Until then every job keeps running in the digest pinned there now.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"

  # THE BASE THE SHIPPED SERVER RUNS ON, and the last `apt-get` in either path.
  #
  # It used to be the third stage of `Containerfile.server`, which meant that apt ran
  # twice per release — amd64, then arm64 under emulation — and once per pull request,
  # since CI builds the server image too. Here it runs weekly, when nobody is waiting.
  #
  # MULTI-ARCH, because the release publishes the server image for both architectures from
  # one `FROM` line. A single-architecture base would pin the server image to one of them
  # and fail the other at build time.
  runtime:
    name: 🧱 Runtime image
    runs-on: ubuntu-26.04
    outputs:
      pin: ${{ steps.say.outputs.pin }}
    steps:
      # THE RECIPE THE PIN WILL SIT NEXT TO, which on a scheduled run is not the one
      # checked out by default. A `schedule` fires from the default branch, so `main` is
      # what lands here — and between two releases `main`'s Containerfile is not develop's.
      # The tag is the hash of that file, and the pin goes to develop, so building from
      # main would open a pull request whose own `ci-image-check` fails: the pin names one
      # hash, develop's files hash to another. A dispatch keeps the branch it was asked
      # from; a push is already restricted to develop.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Compute the tag from what the image is made of
        id: tag
        run: |
          set -eu
          # Dated, immutable, never reused — see the toolchain job above for what
          # reusing a tag cost.
          hash="$(sha256sum Containerfile.runtime | cut -c1-12)"
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rite-runtime"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "ref=$image:$hash-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "moving=$image:$hash" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # A TAG IS NEVER REPUBLISHED, and two runs can legitimately land on the same one:
      # the Monday rebuild publishes `<hash>-<today>`, and a push to develop hours later
      # computes the very same tag from the very same recipe. Pushing it again with bytes
      # that differ — one apt mirror having moved on is enough — untags the first
      # manifest, GHCR collects it, and every digest pinned to it stops resolving.
      #
      # So the second run does not build. It reads the digest already published under that
      # tag and reports it, which is the correct pin anyway: that image IS this recipe.
      # The clock is exempt because it is what produces the day's bytes in the first place.
      - name: Is it already published?
        id: known
        if: github.event_name != 'schedule'
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -eu
          if digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$REF" 2>/dev/null)"; then
            echo "already=$digest" >> "$GITHUB_OUTPUT"
            echo "$REF is already published at $digest — not rebuilding it"
          else
            echo "$REF is not in the registry yet"
          fi

      - name: Build and push
        id: build
        if: steps.known.outputs.already == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.tag.outputs.ref }}
            ${{ steps.tag.outputs.moving }}

      - name: Scan it
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Say what to pin
        id: say
        env:
          REF: ${{ steps.tag.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest || steps.known.outputs.already }}
        run: |
          set -eu
          if [ -z "$DIGEST" ]; then
            echo "::error::no digest — the image was neither built nor found in the registry" >&2
            exit 1
          fi
          digest="$REF@$DIGEST"
          echo "pin=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '## The runtime image this run published'
            echo
            echo '```'
            echo "$digest"
            echo '```'
            echo
            echo 'It is the `FROM … AS runtime` line of `Containerfile.server` — that line IS the pin.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"

  # THE PIN, AS A PULL REQUEST.
  #
  # Publishing a digest nobody reads changes nothing. The two pins are files in this
  # repository — `.github/toolchain-image` and the `FROM … AS runtime` line of
  # `Containerfile.server` — and until they move, every job keeps compiling in the image
  # from the week before. The run that publishes therefore also proposes the line, so that
  # "weekly refresh" means the environment actually refreshes rather than the registry.
  #
  # A PULL REQUEST AND NOT A PUSH. Changing what the whole project builds in is exactly
  # the kind of change that should arrive with evidence. The pull request runs the entire
  # suite INSIDE the new image, so a base that breaks the build says so there, on a branch,
  # instead of on `develop` under someone else's name. That is also why the pin is a file
  # and not a floating tag: nothing moves without a run that proves it.
  #
  # ONLY FROM develop, main AND THE CLOCK. A push on a feature branch publishes an image
  # too — built from a `Containerfile` that branch has and `develop` does not. Pinning that
  # on `develop` would pin an environment whose recipe is not there, and `ci-image-check`
  # would fail on `develop` by construction, since the tag is the hash of the recipe. Those
  # runs publish and report; they propose nothing.
  #
  # ITS CHECKS NEED ONE CLICK. A pull request opened by a workflow using GITHUB_TOKEN
  # creates its `pull_request` runs in an approval-required state — documented GitHub
  # behaviour, not a misconfiguration, and the reason this needs no personal access token.
  # Someone with write access presses "Approve and run" on the pull request page. Since
  # `develop` requires six checks to merge, that click is not optional: a pin nobody
  # approved is a pin that cannot land.
  pin:
    name: 📌 Propose the new pins
    needs: [toolchain, runtime]
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # develop, not the ref this run was triggered on: the pull request targets develop,
      # so its branch has to start there or the diff carries whatever else main has.
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Move both pins
        id: edit
        env:
          TOOLCHAIN: ${{ needs.toolchain.outputs.pin }}
          RUNTIME: ${{ needs.runtime.outputs.pin }}
        run: |
          set -eu
          if [ -z "$TOOLCHAIN" ] || [ -z "$RUNTIME" ]; then
            echo "::error::a build job produced no digest — nothing to pin" >&2
            exit 1
          fi

          # The payload line, keeping every comment above it. `sed -i '1s'` would have
          # overwritten the first line of the file, which is documentation.
          awk -v new="$TOOLCHAIN" '
            !done && !/^#/ && NF { print new; done = 1; next }
            { print }
          ' .github/toolchain-image > .github/toolchain-image.new
          mv .github/toolchain-image.new .github/toolchain-image

          sed -i -E "s|^FROM [^[:space:]]+/rite-runtime:[^[:space:]]+ AS runtime\$|FROM ${RUNTIME} AS runtime|" Containerfile.server

          # VERIFIED, NOT ASSUMED. `sed` that matches nothing exits 0, so a renamed image
          # or a reformatted FROM line would leave the old digest in place and this job
          # would open a pull request claiming to move a pin it never touched.
          if ! grep -qxF "FROM $RUNTIME AS runtime" Containerfile.server; then
            echo "::error file=Containerfile.server::the runtime FROM line was not rewritten — its shape changed" >&2
            exit 1
          fi
          if ! grep -qxF "$TOOLCHAIN" .github/toolchain-image; then
            echo "::error file=.github/toolchain-image::the pin was not rewritten" >&2
            exit 1
          fi

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "develop already pins exactly what this run published — nothing to propose"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # ONE BRANCH, REUSED. A branch per run would leave a stack of pull requests each
      # pinning a digest older than the next, and merging the wrong one silently moves the
      # environment backwards. This force-pushes the same branch, so the open pull request
      # always carries the newest pair and there is never a second one to choose from.
      - name: Open or update the pull request
        if: steps.edit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN: ${{ needs.toolchain.outputs.pin }}
          RUNTIME: ${{ needs.runtime.outputs.pin }}
        run: |
          set -eu
          branch=chore/base-images
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add .github/toolchain-image Containerfile.server
          # Conventional Commits, lowercase subject: commitlint checks this pull request
          # like any other, and a bot that cannot pass the repository's own rules is a bot
          # whose pull requests sit there.
          git commit -m 'build(ci): refresh the pinned base images'
          git push --force origin "$branch"

          body="$(cat <<BODY
          The weekly rebuild published two new base images. This moves both pins to them.

          - toolchain \`$TOOLCHAIN\`
          - runtime \`$RUNTIME\`

          Same recipes, rebuilt from scratch, so the packages inside are current. The tags
          are unchanged apart from their date unless one of the recipes changed — the tag
          is the hash of what the image is made of.

          What makes this reviewable is that the checks on this pull request run IN the
          toolchain image above, and build the server image FROM the runtime one. Green
          here means the new environment builds this project; it is the only evidence that
          matters, and it does not exist anywhere else.

          Opened by \`.github/workflows/base-images.yml\`, run \`$GITHUB_RUN_ID\`.
          BODY
          )"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body "$body"
            echo "updated the open pull request"
          else
            gh pr create --base develop --head "$branch" \
              --title 'build(ci): refresh the pinned base images' --body "$body"
          fi
