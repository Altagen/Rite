name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  # Allow Release to call this as a job
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write

jobs:
  # A Containerfile cannot read a file to pick its base image, so
  # Containerfile.server carries the Rust version as an ARG and the release workflow
  # passes the real one from rust-toolchain.toml. The default in the Containerfile is
  # what local builds get, and nothing stopped it drifting from the pin — a local
  # image would then be built with a different compiler than CI, silently, which is
  # the exact failure the pinning was for. This is the guard that was missing.
  pins:
    name: 📌 Pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Containerfile.server tracks rust-toolchain.toml
        run: |
          pinned="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          arg="$(sed -n 's/^ARG RUST_VERSION=\(.*\)$/\1/p' Containerfile.server)"
          if [ -z "$pinned" ] || [ -z "$arg" ]; then
            echo "::error::could not read the version from one of the two files" >&2
            echo "  rust-toolchain.toml channel: '${pinned:-<none>}'" >&2
            echo "  Containerfile.server ARG:    '${arg:-<none>}'" >&2
            exit 1
          fi
          if [ "$pinned" != "$arg" ]; then
            echo "::error file=Containerfile.server::ARG RUST_VERSION=$arg but rust-toolchain.toml pins $pinned" >&2
            echo "Set both to the same version; the ARG default is what local builds use." >&2
            exit 1
          fi
          echo "both pinned to $pinned"

      - name: Containerfile.server tracks .node-version
        run: |
          # Same contract as the Rust check above, for the same reason: the image that
          # builds the shipped bundle used `node:24-...`, so it tracked a major while the
          # host and CI tracked an exact version. A pin nobody enforces is not a pin.
          pinned="$(tr -d '[:space:]' < .node-version)"
          arg="$(sed -n 's/^ARG NODE_VERSION=\(.*\)$/\1/p' Containerfile.server)"
          if [ -z "$pinned" ] || [ -z "$arg" ]; then
            echo "::error::could not read the Node version from one of the two files" >&2
            echo "  .node-version:                '${pinned:-<none>}'" >&2
            echo "  Containerfile.server ARG:     '${arg:-<none>}'" >&2
            exit 1
          fi
          if [ "$pinned" != "$arg" ]; then
            echo "::error file=Containerfile.server::ARG NODE_VERSION=$arg but .node-version pins $pinned" >&2
            exit 1
          fi
          echo "both pinned to $pinned"

  # Lint commit messages (PRs only)
  commitlint:
    name: 📝 Commit Lint
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Rust tests
  test-rust:
    name: 🦀 Rust Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run Rust tests
        # Not --lib: that skips everything in tests/, which is where the SSH
        # transport, the pre-connect hook and the auth-method wire format are
        # covered. Those ran nowhere in CI until now.
        run: cargo test --workspace --all-features

  # Rust linting
  lint-rust:
    name: 🦀 Rust Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code

      - name: Check formatting
        run: cargo fmt --all -- --check

  # TypeScript type check
  test-typescript:
    name: 🎨 TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run type check
        working-directory: apps/desktop
        run: pnpm typecheck

      # `task check` runs eslint locally and CI never did, so a violation only ever
      # failed for whoever happened to run the local task — the branch took it either
      # way. Type errors were caught here; rule violations were not.
      - name: Run lint
        working-directory: apps/desktop
        run: pnpm lint

  # pnpm security audit
  pnpm-audit:
    name: 🔒 pnpm Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      # Through the script: this step carried `continue-on-error: true`, so a high
      # advisory was printed and the job stayed green. See scripts/audit.sh.
      - name: Security audit
        run: sh scripts/audit.sh js

  # Cargo security audit
  cargo-audit:
    name: 🔒 Cargo Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Through the script, not bare: `cargo audit` exits 0 on a yanked crate and on a
      # check it could not run. See scripts/audit.sh.
      - name: Run security audit
        run: sh scripts/audit.sh rust

  # CodeQL analysis
  codeql:
    name: 🛡️ CodeQL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # SBOM generation
  sbom:
    name: 📋 SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate Cargo SBOM
        run: cargo cyclonedx --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: "**/*.cdx.json"
          retention-days: 30

  # Build check — ensures the workspace compiles before any merge
  build-check:
    name: 🔨 Build Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: ./.github/actions/setup-rust

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Rust build check
        run: cargo check --workspace

      - name: Frontend build check
        working-directory: apps/desktop
        run: pnpm build:frontend

  # Dependency review (PRs only)
  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
