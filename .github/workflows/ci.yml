name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  # Allow Release to call this as a job
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write
  # Pulling the toolchain image: the package is private and lives beside this repository,
  # so GITHUB_TOKEN needs to be allowed to read it. Read only — the image is published by
  # `base-images.yml`, never from here.
  packages: read

jobs:
  # A Containerfile cannot read a file to pick its base image, so
  # Containerfile.server carries the Rust version as an ARG and the release workflow
  # passes the real one from rust-toolchain.toml. The default in the Containerfile is
  # what local builds get, and nothing stopped it drifting from the pin — a local
  # image would then be built with a different compiler than CI, silently, which is
  # the exact failure the pinning was for. This is the guard that was missing.
  # Lint commit messages (PRs only)
  # THE TOOLCHAIN IMAGE, RESOLVED HERE AND BUILT SOMEWHERE ELSE.
  #
  # Four jobs used to run `apt-get install` on a bare runner, then install Rust, then
  # Node, then pnpm — all of which `Containerfile` already contains, and which ADR 0001
  # says must be the SAME environment the local gate uses. "Both sides install the same
  # package names and hope to land on the same versions" is not the same environment.
  #
  # WHAT IT COST, measured: on one run the identical package list took 23s in one job and
  # 34m12s in another, because archive.ubuntu.com had stopped answering. Thirteen jobs,
  # each holding its own ticket against a server that is not ours.
  #
  # So nothing is built here. `.github/workflows/base-images.yml` publishes the image
  # weekly and on a change to what it is made of; this job reads the pinned line, checks
  # that it is really there, and hands it to the jobs below. Seconds.
  #
  # The pin carries a tag AND a digest. The digest is what is pulled; the tag is the hash
  # of the image's inputs, and `ci-image-check` recomputes it — so editing `Containerfile`
  # without republishing fails with the reason, rather than validating the change in the
  # environment it was meant to replace.
  image:
    name: 📦 Toolchain image
    runs-on: ubuntu-26.04
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned image
        id: pin
        run: |
          set -eu
          ref="$(grep -v '^#' .github/toolchain-image | grep -v '^[[:space:]]*$' | head -1)"
          if [ -z "$ref" ]; then
            echo "::error file=.github/toolchain-image::no image pinned" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$ref"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Failing here, with one line, beats four jobs failing on an image pull they
      # cannot explain.
      # TWO QUESTIONS, AND THEY HAVE DIFFERENT ANSWERS. Asking `docker manifest inspect`
      # about a `tag@digest` in one go conflates them: it failed with "not in the registry"
      # on 2026-11-19 while the digest was perfectly present, because the TAG had been
      # moved — a `Base images` run triggered by a tag push republished `<hash>-<date>`.
      # The message sent the reader to rebuild an image that already existed.
      #
      # So the digest is checked on its own, since that is what every job actually pulls,
      # and then the tag is checked to still point at it, since a tag that moved means the
      # never-republish rule was broken somewhere and the next digest may not survive.
      - name: It is published
        env:
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          set -eu
          tagged="${REF%@*}"
          digest="${REF##*@}"
          repo="${tagged%:*}"

          if ! docker manifest inspect "$repo@$digest" >/dev/null 2>&1; then
            echo "::error file=.github/toolchain-image::$digest is not in the registry — the image it named is gone. Run the Base images workflow and pin the line it prints." >&2
            exit 1
          fi

          got="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tagged" 2>/dev/null || true)"
          if [ "$got" != "$digest" ]; then
            echo "::error file=.github/toolchain-image::$tagged now points at ${got:-nothing}, not at the pinned $digest — a published tag was republished, which orphans whatever was pinned to it. Find what rebuilt it before re-pinning." >&2
            exit 1
          fi
          echo "present, and the tag still points at it"

  commitlint:
    name: 📝 Commit Lint
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Rust tests
  test-rust:
    name: 🦀 Rust Tests
    needs: image
    runs-on: ubuntu-26.04
    # In the image, not beside it: no apt, no toolchain install, and the same filesystem
    # the local gate runs in. This job lost its "Install system dependencies" step, and
    # with it the 23s-to-25m spread that step had across jobs on one run.
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run Rust tests
        # Not --lib: that skips everything in tests/, which is where the SSH
        # transport, the pre-connect hook and the auth-method wire format are
        # covered. Those ran nowhere in CI until now.
        run: cargo test --workspace --all-features

  # Rust linting
  lint-rust:
    name: 🦀 Rust Lint
    needs: image
    runs-on: ubuntu-26.04
    # In the image, not beside it: no apt, no toolchain install, and the same filesystem
    # the local gate runs in. This job lost its "Install system dependencies" step, and
    # with it the 23s-to-25m spread that step had across jobs on one run.
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code

      - name: Check formatting
        run: cargo fmt --all -- --check

  # TypeScript type check
  test-typescript:
    name: 🎨 TypeScript
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run type check
        working-directory: apps/desktop
        run: pnpm typecheck

      # `task check` runs eslint locally and CI never did, so a violation only ever
      # failed for whoever happened to run the local task — the branch took it either
      # way. Type errors were caught here; rule violations were not.
      - name: Run lint
        working-directory: apps/desktop
        run: pnpm lint

  # pnpm security audit
  pnpm-audit:
    name: 🔒 pnpm Audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      # Through the script: this step carried `continue-on-error: true`, so a high
      # advisory was printed and the job stayed green. See scripts/audit.sh.
      - name: Security audit
        run: sh scripts/audit.sh js

  # Cargo security audit
  cargo-audit:
    name: 🔒 Cargo Audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Through the script, not bare: `cargo audit` exits 0 on a yanked crate and on a
      # check it could not run. See scripts/audit.sh.
      - name: Run security audit
        run: sh scripts/audit.sh rust

  # CodeQL analysis
  codeql:
    name: 🛡️ CodeQL
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # SBOM generation
  sbom:
    name: 📋 SBOM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate Cargo SBOM
        run: cargo cyclonedx --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: "**/*.cdx.json"
          retention-days: 30

  # Build check — ensures the workspace compiles before any merge
  build-check:
    name: 🔨 Build Check
    needs: image
    runs-on: ubuntu-26.04
    # In the image, not beside it: no apt, no toolchain install, and the same filesystem
    # the local gate runs in. This job lost its "Install system dependencies" step, and
    # with it the 23s-to-25m spread that step had across jobs on one run.
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Rust build check
        run: cargo check --workspace

      - name: Frontend build check
        working-directory: apps/desktop
        run: pnpm build:frontend

  # THE 69 STANDALONE CHECKS, which until now ran only in the local gate.
  #
  # That gap had a cost and it was paid: Dependabot #436 (ubuntu 24.04 -> 25.10) was
  # reported fully green here while `ci-image-check` fails on it, because that check —
  # the one holding the Containerfile and every `runs-on` to the same Ubuntu — was never
  # asked. A green tick on a dependency PR meant less than it looked like.
  #
  # It needs more than node: `embedded-ui-check` compares the built bundle with the one
  # embedded in the server, and the server checks each drive a real rite-server through a
  # full bootstrap. So this job builds the frontend, embeds it, and builds the server in
  # debug — the same order `e2e/gate.sh` step 1 uses locally.
  checks:
    name: 🧪 Standalone checks
    needs: image
    runs-on: ubuntu-26.04
    # In the image, not beside it: no apt, no toolchain install, and the same filesystem
    # the local gate runs in. This job lost its "Install system dependencies" step, and
    # with it the 23s-to-25m spread that step had across jobs on one run.
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build the frontend and embed it
        run: |
          pnpm --filter desktop build
          sh scripts/embed-ui.sh

      - name: Build the server the checks drive
        run: cargo build -p rite-server

      - name: Run the standalone checks
        run: sh e2e/run-checks.sh

  # THE SERVER IMAGE, BUILT AND STARTED — because nothing else here builds it.
  #
  # `Containerfile.server` is the only artefact we ship that is a distribution rather
  # than a binary, and until this job the first thing that ever built it was the release
  # workflow: on two architectures, under emulation, at the one moment nobody wants to
  # debug it. Every toolchain move it carries — the Rust and Node ARGs, the three Debian
  # stages — was therefore validated by reading, or by someone building it by hand.
  #
  # IT STARTS THE IMAGE, which is the half a build cannot tell you. A binary compiled
  # against one glibc and run on another fails at LOAD, so a builder stage moved without
  # the runtime produces an image that builds perfectly and dies on `docker run`.
  # `ci-image-check` holds the three stages to one Debian suite; this proves it.
  #
  # amd64 only, and deliberately: arm64 here means QEMU and the better part of an hour on
  # every pull request, while the release builds both natively per architecture. What this
  # job answers is whether the recipe is sound, not whether it cross-builds.
  #
  # WHILE IT IS WORTH ITS MINUTES. It was added during the 0.2.10 toolchain work (Ubuntu
  # 26.04, Rust 1.100, Node 26, Debian trixie), where the image changed under every one of
  # them. If this settles down and the job spends a year saying yes, it is a candidate for
  # `pull_request` paths touching Containerfile.server and the manifests — not for
  # deletion, since what it catches is invisible until a tag.
  # THE SERVER BINARY, BUILT THE WAY THE RELEASE BUILDS IT. That is the job's whole
  # purpose: the release compiles this binary on a runner and hands it to a COPY-only
  # image, so CI does the same. Testing a recipe nobody ships proves nothing about what
  # ships — and the recipe this replaces, which compiled the workspace inside the image
  # build, is exactly what the release stopped doing.
  #
  # ubuntu-22.04, AND NOT THE TOOLCHAIN IMAGE. Every other compiling job here runs inside
  # `rite-ci`, which is Ubuntu 26.04 with glibc 2.43; this binary runs on the Debian trixie
  # base, which has 2.41. Built in the toolchain image it would compile and then fail at
  # `docker run`, from the loader. The reasoning lives in the composite action, the numbers
  # are held by `e2e/ci-image-check.mjs`.
  server-binary:
    name: 🦀 Server binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-server-binary
        with:
          cache-key: server-amd64

      - name: Upload it
        uses: actions/upload-artifact@v7
        with:
          name: server-binary-amd64
          path: target/release/rite-server
          if-no-files-found: error

  # amd64 only here. The release publishes both architectures from the same COPY-only
  # recipe, and the second one would prove nothing this one does not: there is no
  # compilation left to go wrong per architecture.
  server-image:
    name: 🐳 Server image
    needs: server-binary
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The runtime stage is `FROM ghcr.io/…/rite-runtime@sha256:…`, which is a private
      # package: without this the build fails on the base image, not on anything in it.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Where `Containerfile.server` looks: dist/<TARGETARCH>/rite-server.
      - name: Collect the binary
        uses: actions/download-artifact@v8
        with:
          name: server-binary-amd64
          path: dist/amd64

      # Nothing is compiled and nothing is emulated — the COPY sets the executable bit the
      # artifact did not keep.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile.server
          platforms: linux/amd64
          load: true
          tags: rite-server:ci

      - name: It starts, and is the release this commit says it is
        run: |
          set -eu
          # The workspace version, not a dependency's — the same reading `version-check`
          # does, and the number the server reports on /api/capabilities.
          want="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
                  | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
          test -n "$want"
          docker run -d --rm --name rite-ci -p 127.0.0.1:1421:1421 rite-server:ci
          payload=''
          for _ in $(seq 1 60); do
            payload="$(curl -fsS http://127.0.0.1:1421/api/capabilities || true)"
            [ -n "$payload" ] && break
            sleep 1
          done
          if [ -z "$payload" ]; then
            echo "::error file=Containerfile.server::the image never answered /api/capabilities" >&2
            docker logs rite-ci >&2 || true
            exit 1
          fi
          echo "$payload"
          got="$(printf '%s' "$payload" | jq -r .version)"
          if [ "$got" != "$want" ]; then
            echo "::error file=Containerfile.server::the image reports $got, Cargo.toml says $want" >&2
            exit 1
          fi
          # The two properties the runtime stage carries that a build cannot show: it is
          # not root, and a terminal opened from the web UI lands in the home and not /.
          user="$(docker inspect -f '{{.Config.User}}' rite-server:ci)"
          dir="$(docker inspect -f '{{.Config.WorkingDir}}' rite-server:ci)"
          echo "user=$user workdir=$dir"
          test "$user" = "rite"
          test "$dir" = "/home/rite"

      - name: Stop it
        if: always()
        run: docker rm -f rite-ci || true

  # Dependency review (PRs only)
  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
