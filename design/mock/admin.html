<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rite · Admin console (mock)</title>
<link rel="stylesheet" href="rite.css">
<style>
  /* Admin-console-only chrome (the shared bits live in rite.css). This dashboard
     is a SEPARATE surface from the connection manager — served at /admin, gated to
     admins, so it can be deployed on its own (see rite-admin-console-split memory). */
  .brand-logo{height:26px;border-radius:7px;display:block}
  .admin-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in oklab,var(--accent) 40%,transparent);border-radius:6px;padding:2px 7px}
  .inst{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--card);font-weight:650}
  .inst .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .admin-body{display:flex;flex:1;min-height:0}
  .admin-nav{width:220px;border-right:1px solid var(--border);background:var(--bg2);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);cursor:pointer;font-weight:550;font-size:14px;border:1px solid transparent}
  .navitem:hover{background:var(--card2)}
  .navitem.on{background:color-mix(in oklab,var(--accent) 15%,transparent);color:var(--accent);border-color:color-mix(in oklab,var(--accent) 30%,transparent)}
  .navitem .ic{display:grid;place-items:center;opacity:.85}
  .admin-main{flex:1;overflow:auto;padding:26px 30px}
  .page-h{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .page-h h1{font-size:22px;font-weight:700}
  .page-h .sub{color:var(--muted);font-size:13px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .stat .v{font-size:30px;font-weight:750;margin-top:6px;line-height:1}
  .stat .d{font-size:12px;color:var(--fg-dim);margin-top:6px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .panel-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .panel-h .t{font-weight:650;font-size:15px}
  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 18px;border-bottom:1px solid var(--border)}
  table.tbl td{padding:12px 18px;border-bottom:1px solid var(--border);font-size:14px}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tr:hover td{background:var(--card2)}
  .role-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .role-admin{background:color-mix(in oklab,var(--accent) 18%,transparent);color:var(--accent)}
  .role-user{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .st .dot{width:8px;height:8px;border-radius:50%}
  .st.active .dot{background:var(--green)} .st.active{color:var(--fg-dim)}
  .st.disabled .dot{background:var(--muted)} .st.disabled{color:var(--muted)}
  .rowacts{display:flex;gap:2px;justify-content:flex-end}
  .rowacts .btn{padding:5px}
  .avs{display:flex}.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0a0e1a;margin-left:-7px;border:2px solid var(--card)}.av:first-child{margin-left:0}
  .tcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:.13s}
  .tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .toggle{width:42px;height:24px;border-radius:999px;background:var(--card2);border:1px solid var(--border2);position:relative;cursor:pointer;flex-shrink:0}
  .toggle.on{background:var(--accent);border-color:var(--accent)}
  .toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.toggle.on i{left:20px}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
  .setrow:last-child{border-bottom:none}
  .setrow .lab{font-weight:600} .setrow .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .maxw{max-width:100%}
  .admin-main .wrap{max-width:1400px;margin:0 auto}
  table.tbl tr.click{cursor:pointer} table.tbl tr.click:hover td{background:var(--card2)}
  .back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .back:hover{color:var(--fg)}
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:none} .mrow:hover{background:var(--card2)} .mrow .nm{flex:1;font-weight:550}
  .add-pick{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--border);background:var(--bg2)}
  .add-pick select{flex:1}
  .chev{color:var(--muted);display:grid;place-items:center}
  .soon{font-size:10px;font-weight:700;color:var(--amber);border:1px solid color-mix(in oklab,var(--amber) 40%,transparent);border-radius:5px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
  .zk{display:flex;align-items:flex-start;gap:10px;background:color-mix(in oklab,var(--accent) 8%,transparent);border:1px solid color-mix(in oklab,var(--accent) 25%,transparent);border-radius:11px;padding:12px 14px;margin-bottom:20px;font-size:13px;color:var(--fg-dim);max-width:820px}
  .zk .ic{color:var(--accent);flex-shrink:0;display:grid;place-items:center;margin-top:1px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border2);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:80;font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .appbar{flex-wrap:wrap;row-gap:8px}
  /* Typeahead: search users by prefix instead of a dropdown of everyone. */
  .ta{position:relative;max-width:440px}
  .ta .inp{width:100%}
  .ta-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);z-index:30;max-height:240px;overflow:auto;padding:4px}
  .ta-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .ta-item:hover{background:var(--card2)}
  .ta-empty{padding:10px 12px;color:var(--muted);font-size:13px}
  /* Account-reset confirm dialog (lost-password recovery, keeps identity). */
  .rk{font-size:13px;border-radius:9px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--border);line-height:1.5}
  .rk.keep{background:color-mix(in oklab,var(--green) 10%,transparent);border-color:color-mix(in oklab,var(--green) 30%,transparent)}
  .rk.lose{background:color-mix(in oklab,var(--red) 10%,transparent);border-color:color-mix(in oklab,var(--red) 30%,transparent)}
  .rk.next{background:var(--bg2)}
  .btn-danger{background:var(--red);border-color:var(--red);color:#0a0e1a}
  .btn-danger:hover{background:#f98da2;border-color:#f98da2}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{background:var(--red);border-color:var(--red)}
  /* Responsive: narrow the nav, then turn it into a horizontal tab bar on top. */
  @media (max-width:900px){ .admin-nav{width:180px} .admin-main{padding:20px 18px} }
  @media (max-width:640px){ .admin-body{flex-direction:column} .admin-nav{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:8px} .navitem{white-space:nowrap} .admin-main{padding:18px 14px} .admin-main .panel{overflow-x:auto} }
</style>
</head>

II=" alt="Rite"><span class="admin-tag">Admin</span></div>
    <div class="inst"><span class="dot"></span><span id="instName">Acme Corp</span> <span class="muted" style="font-weight:400;font-size:12px">· rite.acme.io</span></div>

<div style="position:fixed;bottom:12px;right:14px;color:var(--muted);font-size:12px">Rite · <b>admin console</b> · served at <code>/admin</code>, admins only · separate surface</div>
<div class="backdrop" id="bd" onclick="closeBd()"></div>
<script src="full-data.js"></script>
<script>
/* ================= Rite admin console (mock) =================
   A dedicated dashboard for server operators — deployable independently of the
   connection-manager web UI (RITE_SERVE_ADMIN). Users / Teams / Instance, plus a
   small overview. Actions are stubbed (toasts). */
const AV_COLORS=['#7c9cf5','#9ece6a','#e5b567','#f0a35e','#f7768e','#bb9af7','#56c7c0'];
const avColor=n=>AV_COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
const av=n=>`<span class="av" style="background:${avColor(n)}" title="${n}">${n[0].toUpperCase()}</span>`;
const layers='<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3.5 12L12 17l8.5-5M3.5 16L12 21l8.5-5"/></svg>';
const backBtn=t=>`<span class="back" onclick="SUB=null;renderContent()"><svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> ${t}</span>`;
const chevR='<span class="chev"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
// A couple of demo states on top of ORG so the table isn't all-identical.
const STATUS={frank:'disabled'};
const NAV=[
  {id:'overview',label:'Overview',ic:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>'},
  {id:'users',label:'Users',ic:EXICON.users},
  {id:'teams',label:'Teams',ic:'<svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17" cy="9" r="2.2"/><path d="M15.5 20a6 6 0 016-1.5"/></svg>'},
  {id:'collections',label:'Collections',ic:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3.5 12L12 17l8.5-5M3.5 16L12 21l8.5-5"/></svg>'},
  {id:'instance',label:'Instance',ic:EXICON.gear},
];
let SEC='overview', SUB=null; // SUB = drilled-in team/collection index
// Flatten COLL (nesting is view-only) for the governance list. The admin governs
// membership/structure; machine credentials stay encrypted (see the ZK banner).
const FLATCOLL=[];(function rec(l){l.forEach(c=>{FLATCOLL.push({name:c.name,shared:c.shared,members:c.members.slice(),owner:c.members[0]||'alex',machines:(c.conns||[]).length,pending:[],
  id:[...c.name].reduce((a,ch)=>(a*33+ch.charCodeAt(0))>>>0,7).toString(16).padStart(8,'0').slice(0,8)});if(c.children)rec(c.children);});})(COLL);
// Demo: a roster-only member — an admin granted them name/roster access via the group
// escrow; they hold no itemsKey until a member seals machine access ("roster only").
(function(){const c=FLATCOLL.find(x=>x.shared&&x.members.length>2);if(c)c.pending=[c.members[c.members.length-1]];})();
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>`<div class="navitem ${SEC===n.id?'on':''}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</div>`).join('');}
function go(id){SEC=id;SUB=null;renderNav();renderContent();}
function drill(i){SUB=i;renderContent();}
function memberRow(m,removable,pending){return `<div class="mrow">${av(m)}<span class="nm">${m}</span>${pending?'<span class="role-badge role-user" title="Roster access only — awaiting machine access from a member">roster only</span>':''}${removable?`<button class="btn btn-ghost btn-sm" title="Remove" onclick="toast('Remove ${m}')" style="color:var(--red)">${EXICON.trash}</button>`:'<span class="muted" style="font-size:12px">owner</span>'}</div>`;}
// Typeahead over the directory (prefix search) instead of a dropdown of everyone —
// in the real app this hits a search endpoint, so we never ship the whole list.
function addPicker(existing,label){return `<div class="add-pick"><div class="ta"><input class="inp" placeholder="Type a username to add…" data-ex="${existing.join(',')}" data-label="${label}" oninput="taSearch(this)"><div class="ta-menu" hidden></div></div></div>`;}
function taSearch(inp){const q=inp.value.trim().toLowerCase();const menu=inp.nextElementSibling;
  const ex=(inp.dataset.ex||'').split(',').filter(Boolean);
  if(!q){menu.hidden=true;menu.innerHTML='';return;}
  const hits=ORG.users.map(u=>u.u).filter(u=>!ex.includes(u)&&u.toLowerCase().startsWith(q)).slice(0,8);
  menu.innerHTML=hits.length?hits.map(u=>`<div class="ta-item" data-u="${u}" data-label="${inp.dataset.label||''}" onclick="taPick(this)">${av(u)}<span>${u}</span></div>`).join('')
    :`<div class="ta-empty">No user starts with “${inp.value.trim()}”.</div>`;
  menu.hidden=false;}
function taPick(el){toast('Added '+el.dataset.u+' to '+el.dataset.label);const menu=el.parentElement;menu.hidden=true;const inp=menu.previousElementSibling;if(inp)inp.value='';}
document.addEventListener('click',e=>{if(!e.target.closest('.ta'))document.querySelectorAll('.ta-menu').forEach(m=>m.hidden=true);});

function statCard(k,v,d){return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;}

function overview(){
  const admins=ORG.users.filter(u=>u.role==='admin').length;
  const active=ORG.users.filter(u=>STATUS[u.u]!=='disabled').length;
  return `<div class="page-h"><h1>Overview</h1><span class="sub">This Rite instance at a glance</span></div>
    <div class="stat-grid">
      ${statCard('Users',ORG.users.length,`${active} active · ${ORG.users.length-active} disabled`)}
      ${statCard('Admins',admins,'with full server access')}
      ${statCard('Teams',ORG.teams.length,'RBAC groups')}
      ${statCard('Live sessions',4,'terminals open now')}
    </div>
    <div class="panel maxw">
      <div class="panel-h"><span class="t">Recent activity</span></div>
      <table class="tbl"><tbody>
        ${[['carol','signed in','2m ago'],['alex','created user “frank”','1h ago'],['dan','opened Production','3h ago'],['erin','left team Ops','yesterday']].map(([u,a,t])=>`<tr><td style="width:1px">${av(u)}</td><td><b>${u}</b> ${a}</td><td style="text-align:right;color:var(--muted)">${t}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}

function users(){
  return `<div class="page-h"><h1>Users</h1><span class="sub">${ORG.users.length} accounts</span><div style="flex:1"></div>
      <button class="btn btn-primary btn-sm" onclick="toast('New user…')">${ICONplus} New user</button></div>
    <div class="panel">
      <table class="tbl">
        <thead><tr><th>Username</th><th>Role</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>${ORG.users.map(u=>{const st=STATUS[u.u]||'active';return `<tr>
          <td><div style="display:flex;align-items:center;gap:10px">${av(u.u)}<b>${u.u}</b>${u.u===ORG.me?'<span class="muted" style="font-size:12px">(you)</span>':''}</div></td>
          <td><span class="role-badge role-${u.role}">${u.role}</span></td>
          <td><span class="st ${st}"><span class="dot"></span>${st}</span></td>
          <td><div class="rowacts">
            <button class="btn btn-ghost" title="Change role" onclick="toast('Change role of ${u.u}')">${EXICON.shield}</button>
            ${u.u===ORG.me?'':`<button class="btn btn-ghost" title="Reset access (lost password)" onclick="askReset('${u.u}')" style="color:var(--amber)"><svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3.4M16.5 6.7l2.2 2.2M13.6 9.6l2.2 2.2"/></svg></button>`}
            <button class="btn btn-ghost" title="${st==='active'?'Disable':'Enable'}" onclick="toast('${st==='active'?'Disable':'Enable'} ${u.u}')"><svg class="icon" viewBox="0 0 24 24">${st==='active'?'<path d="M18.36 6.64A9 9 0 015.64 18.36M12 3v9"/>':'<path d="M5 12l5 5L20 7"/>'}</svg></button>
            <button class="btn btn-ghost" title="Delete" onclick="toast('Delete ${u.u}')" style="color:var(--red)">${EXICON.trash}</button>
          </div></td></tr>`;}).join('')}</tbody>
      </table>
    </div>`;
}

function teams(){
  if(SUB!==null){const t=ORG.teams[SUB];return `<div class="page-h">${backBtn('Teams')}</div>
    <div class="page-h" style="margin-bottom:16px"><span style="color:var(--accent)">${EXICON.users}</span><h1>${t.name}</h1><span class="sub">${t.members.length} members</span></div>
    <div class="panel" style="overflow:visible"><div class="panel-h"><span class="t">Members</span></div>
      ${t.members.map(m=>memberRow(m,m!==t.members[0])).join('')}${addPicker(t.members,t.name)}</div>
    <div class="panel"><div class="panel-h"><span class="t">Danger zone</span></div>
      <div style="padding:14px 18px;display:flex;align-items:center;gap:12px"><span style="flex:1"><b>Delete team</b><div class="muted" style="font-size:12px">Removes the team (a roster). Collections offered to it are no longer offered; membership in those collections is unaffected.</div></span><button class="btn btn-sm" style="color:var(--red)" onclick="toast('Delete “${t.name}”…')">Delete</button></div></div>`;}
  return `<div class="page-h"><h1>Teams</h1><span class="sub">${ORG.teams.length} groups · RBAC</span><div style="flex:1"></div>
      <button class="btn btn-primary btn-sm" onclick="toast('New team…')">${ICONplus} New team</button></div>
    <div class="panel"><table class="tbl">
      <thead><tr><th>Team</th><th>Members</th><th style="text-align:right">Manage</th></tr></thead>
      <tbody>${ORG.teams.map((t,i)=>`<tr class="click" onclick="drill(${i})">
        <td><div style="display:flex;align-items:center;gap:10px"><span style="color:var(--accent)">${EXICON.users}</span><b>${t.name}</b></div></td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="avs">${t.members.slice(0,5).map(av).join('')}</div><span class="muted" style="font-size:13px">${t.members.length}</span></div></td>
        <td><div style="display:flex;justify-content:flex-end">${chevR}</div></td></tr>`).join('')}</tbody>
    </table></div>`;
}

let PERSIST=true, WEBUI=true, ADMINUI=true;
function tog(v){return `<div class="toggle ${v?'on':''}"><i></i></div>`;}
function instance(){
  return `<div class="page-h"><h1>Instance</h1><span class="sub">Server-wide settings</span></div>
    <div class="panel maxw" style="padding:6px 20px 12px">
      <div class="setrow"><div><div class="lab">Instance name</div><div class="hint">Shown on the sign-in screen and the header so users can tell instances apart.</div></div>
        <div style="display:flex;gap:8px"><input class="inp" style="width:200px" value="Acme Corp"><button class="btn btn-primary btn-sm" onclick="toast('Instance name saved')">Save</button></div></div>
      <div class="setrow"><div><div class="lab">Session persistence</div><div class="hint">Let users stay signed in across reloads (vault key in sessionStorage, cleared on tab close). Still zero-knowledge.</div></div>
        <div onclick="PERSIST=!PERSIST;renderContent();toast('Session persistence '+(PERSIST?'on':'off'))">${tog(PERSIST)}</div></div>
      <div class="setrow"><div><div class="lab">Serve the web UI <span class="soon">planned</span></div><div class="hint">The base connection-manager UI at <code>/</code>. Disable to force clients to use the desktop app.</div></div>
        <div onclick="WEBUI=!WEBUI;renderContent();toast('Serve web UI '+(WEBUI?'on':'off'))">${tog(WEBUI)}</div></div>
      <div class="setrow"><div><div class="lab">Serve this admin console <span class="soon">planned</span></div><div class="hint">This dashboard at <code>/admin</code>. Turn off for a deployment managed purely as-code.</div></div>
        <div onclick="ADMINUI=!ADMINUI;renderContent();toast('Serve admin console '+(ADMINUI?'on':'off'))">${tog(ADMINUI)}</div></div>
      <div class="setrow"><div><div class="lab">Host key</div><div class="hint">SHA256:qF3g…8dKz — pin this on first connect.</div></div>
        <button class="btn btn-sm" onclick="toast('Host key copied')">Copy</button></div>
    </div>`;
}

let COLLCREATE=true, COLLSHARE=true;
function collections(){
  if(SUB!==null){const c=FLATCOLL[SUB];return `<div class="page-h">${backBtn('Collections')}</div>
    <div class="page-h" style="margin-bottom:16px"><span style="color:var(--accent)">${layers}</span><h1>${c.shared?c.name:'Collection '+c.id}</h1>${c.shared?'':'<span class="role-badge role-user" style="background:var(--card2);color:var(--muted);border:1px solid var(--border);padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase">Personal · name private</span>'}<span class="sub">· owner ${c.owner} · ${c.machines} machine${c.machines===1?'':'s'}</span></div>
    <div class="panel" style="overflow:visible"><div class="panel-h"><span class="t">Members · ${c.members.length}</span></div>
      ${c.members.map(m=>memberRow(m,m!==c.owner,c.pending.includes(m))).join('')}
      ${c.shared?`<div style="padding:12px 18px;border-top:1px solid var(--border)"><div style="font-weight:600;font-size:13px;margin-bottom:2px">Grant name / roster access</div><div class="muted" style="font-size:12px;margin-bottom:8px">Adds them to the roster and lets them see the name (via the group escrow). Machine access is completed by a member.</div>${addPicker(c.members,c.name)}</div>`:''}</div>
    <div class="panel"><div class="panel-h"><span class="t">Danger zone</span></div>
      <div style="padding:14px 18px;display:flex;align-items:center;gap:12px"><span style="flex:1"><b>Delete collection</b><div class="muted" style="font-size:12px">Force-remove it for every member. The encrypted machines are lost.</div></span><button class="btn btn-sm" style="color:var(--red)" onclick="toast('Delete “${c.name}”…')">Delete</button></div></div>`;}
  const shared=FLATCOLL.filter(c=>c.shared).length, personal=FLATCOLL.length-shared;
  const machines=FLATCOLL.reduce((n,c)=>n+c.machines,0);
  return `<div class="page-h"><h1>Collections</h1><span class="sub">Server-wide governance</span></div>
    <div class="zk"><span class="ic">${EXICON.shield}</span><div><b>Zero-knowledge.</b> The server holds no keys. Collection <b>names</b> are readable here only through the Admin-group escrow; machine hosts &amp; credentials stay sealed to members — even admins can't read them. Un-escrowed collections (e.g. personal) show by id. Granting a member gives <b>name/roster</b> access; full machine access is completed by a member.</div></div>
    <div class="stat-grid">
      ${statCard('Collections',FLATCOLL.length,`${shared} shared · ${personal} personal`)}
      ${statCard('Machines',machines,'across all collections')}
      ${statCard('Orphaned',2,'empty &amp; unused &gt; 30d')}
      ${statCard('Avg members','2.4','per shared collection')}
    </div>
    <div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">All collections</span><span style="flex:1"></span><button class="btn btn-primary btn-sm" onclick="toast('New collection…')">${ICONplus} New</button></div>
      <table class="tbl"><thead><tr><th>Collection</th><th>Owner</th><th>Members</th><th>Machines</th><th style="text-align:right">Manage</th></tr></thead>
      <tbody>${FLATCOLL.map((c,i)=>`<tr class="click" onclick="drill(${i})">
        <td><div style="display:flex;align-items:center;gap:10px"><span style="color:var(--accent)">${layers}</span>${c.shared?`<b>${c.name}</b>`:`<b class="muted">Collection ${c.id}</b><span class="muted" style="font-size:11px">· personal · name private</span>`}</div></td>
        <td>${av(c.owner)}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div class="avs">${c.members.slice(0,5).map(av).join('')}</div><span class="muted" style="font-size:13px">${c.members.length}</span></div></td>
        <td>${c.machines}</td>
        <td><div style="display:flex;justify-content:flex-end">${chevR}</div></td></tr>`).join('')}</tbody></table></div>
    <div class="panel" style="padding:6px 20px 12px;margin-bottom:16px">
      <div class="setrow"><div><div class="lab">Allow users to create collections</div><div class="hint">When off, only admins provision collections.</div></div><div onclick="COLLCREATE=!COLLCREATE;renderContent();toast('Create '+(COLLCREATE?'allowed':'blocked'))">${tog(COLLCREATE)}</div></div>
      <div class="setrow"><div><div class="lab">Allow sharing outside teams</div><div class="hint">Members can add anyone in the directory, not just teammates.</div></div><div onclick="COLLSHARE=!COLLSHARE;renderContent();toast('External sharing '+(COLLSHARE?'on':'off'))">${tog(COLLSHARE)}</div></div>
      <div class="setrow"><div><div class="lab">Max members per collection</div><div class="hint">0 = unlimited.</div></div><input class="inp" style="width:90px" value="0"></div>
      <div class="setrow"><div><div class="lab">Default role for new members</div><div class="hint">Applied when someone is added to a collection.</div></div><select class="inp" style="width:auto"><option>viewer</option><option>editor</option></select></div>
    </div>
    <div class="panel"><div class="panel-h"><span class="t">Cleanup</span></div>
      <div style="padding:14px 18px;display:flex;align-items:center;gap:12px"><span class="muted" style="flex:1">2 collections are empty and haven't been opened in 30+ days.</span><button class="btn btn-sm" onclick="toast('Review orphaned collections')">Review</button></div>
    </div>`;
}

const ICONplus='<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';

// Account reset (a user lost their password). No email → no self-service reset; an
// admin authorises it after an out-of-band identity check. It is NOT a key rotation:
// the admin never learns the new password. The old crypto is purged; the user keeps
// their username + team memberships and sets a new password at next sign-in, then
// re-requests access to their collections. See setup.html for that screen.
function closeBd(){document.getElementById('bd').classList.remove('show');}
function askReset(u){
  const b=document.getElementById('bd');
  b.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <header><h3>Reset access for ${u}?</h3><p>Use this when <b>${u}</b> has lost their password. There's no email recovery — a reset lets them keep their identity and set a new password. Verify it's really them first (in person, phone…).</p></header>
    <div class="body">
      <div class="rk keep"><b>Kept:</b> the username <b>${u}</b>, their role, and every team they're in — so they can find their way back to their collections.</div>
      <div class="rk lose"><b>Lost for good:</b> everything encrypted under the old password — their personal connections and any solo collection. It's end-to-end encrypted, so no one (not even you) can recover it.</div>
      <div class="rk next"><b>Next:</b> ${u} chooses a new password at their next sign-in, then re-requests access to the collections offered to their teams — a member grants them back in. You never see the new password.</div>
      <label class="field"><span>Type <b>${u}</b> to confirm</span><input class="inp" id="rkc" autocomplete="off" oninput="document.getElementById('rkgo').disabled=this.value.trim()!=='${u}'" placeholder="${u}"></label>
    </div>
    <div class="foot"><button class="btn btn-sm" onclick="closeBd()">Cancel</button><button class="btn btn-sm btn-danger" id="rkgo" disabled onclick="closeBd();toast('Access reset — ${u} can set a new password at next sign-in')">Reset access</button></div>
  </div>`;
  b.classList.add('show');
  setTimeout(()=>{const i=document.getElementById('rkc');if(i)i.focus();},30);
}
function renderContent(){document.getElementById('content').innerHTML='<div class="wrap">'+({overview,users,teams,collections,instance})[SEC]()+'</div>';}
function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}
renderNav();renderContent();
</script>
</body>
</html>
