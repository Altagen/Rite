<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rite · Teams (mock)</title>
<link rel="stylesheet" href="rite.css">
<style>
  /* The USER's teams view — the teams I belong to (keyless rosters). A manager
     maintains who's in the team; sharing machines is always a collection. A member
     discovers the collections offered to the team and requests access. Teams are
     created/deleted by the org-admin (console). */
  .brand-logo{height:26px;border-radius:7px;display:block}
  .inst{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--card);font-weight:650}
  .inst .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .cbody{display:flex;flex:1;min-height:0}
  .clist{width:320px;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0}
  .clist-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
  .clist-h .eyebrow{flex:1}
  .clist-scroll{flex:1;overflow:auto;padding:0 8px 12px}
  .crow{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .crow:hover{background:var(--card2)}
  .crow.on{background:color-mix(in oklab,var(--accent) 13%,transparent);border-color:color-mix(in oklab,var(--accent) 30%,transparent)}
  .crow .nm{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmain{flex:1;overflow:auto;padding:26px 30px}
  .cmain-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .cmain-h h1{font-size:22px;font-weight:700}
  .cmain-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .role-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .role-admin{background:color-mix(in oklab,var(--accent) 18%,transparent);color:var(--accent)}
  .role-member{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0a0e1a}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;max-width:1160px}
  .panel-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .panel-h .t{font-weight:650;font-size:15px;flex:1}
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:none} .mrow:hover{background:var(--card2)}
  .mrow .nm{flex:1;font-weight:550}
  .keyed{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green)}
  .keyed .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .nokey{font-size:12px;color:var(--muted)}
  .needkey{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in oklab,#f59e0b 20%,transparent);color:#f59e0b}
  .needkey .icon{width:13px;height:13px}
  .nudge{display:flex;gap:11px;align-items:flex-start;background:color-mix(in oklab,#f59e0b 12%,transparent);border:1px solid color-mix(in oklab,#f59e0b 32%,transparent);border-radius:12px;padding:13px 15px;margin-bottom:18px;max-width:1160px;font-size:13px;color:color-mix(in oklab,var(--fg) 82%,transparent)}
  .nudge .ic{color:#f59e0b;flex-shrink:0;margin-top:1px}
  .add-pick{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
  /* Typeahead: search users by prefix instead of a dropdown of everyone. */
  .ta{position:relative;flex:1}
  .ta-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);z-index:30;max-height:240px;overflow:auto;padding:4px}
  .ta-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .ta-item:hover{background:var(--card2)}
  .ta-empty{padding:10px 12px;color:var(--muted);font-size:13px}
  .danger{border-color:color-mix(in oklab,var(--red) 35%,transparent)}
  .zk{display:flex;gap:11px;align-items:flex-start;background:color-mix(in oklab,var(--accent) 8%,transparent);border:1px solid color-mix(in oklab,var(--accent) 25%,transparent);border-radius:12px;padding:13px 15px;margin-bottom:18px;max-width:1160px;font-size:13px;color:color-mix(in oklab,var(--fg) 80%,transparent)}
  .zk .ic{color:var(--accent);flex-shrink:0;margin-top:1px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border2);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:80;font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .appbar{flex-wrap:wrap;row-gap:8px}
  /* Responsive master-detail: narrow the rail, then stack it above the detail. */
  @media (max-width:900px){ .clist{width:250px} .cmain{padding:20px 18px} }
  @media (max-width:640px){ .cbody{flex-direction:column} .clist{width:100%;max-height:190px;border-right:none;border-bottom:1px solid var(--border)} .cmain{padding:18px 14px} }
</style>
</head>

<script>
/* ================= Rite teams (user view, mock) =================
   The teams I belong to. A team-admin (team_members.role='admin') manages the
   roster + the team key themselves; a member sees it read-only. Teams are created
   and deleted by the org-admin (in the admin console), so there's no New/Delete here. */
const ME='alex';
const AV_COLORS=['#7c9cf5','#9ece6a','#e5b567','#f0a35e','#f7768e','#bb9af7','#56c7c0'];
const avColor=n=>AV_COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
const av=n=>`<span class="av" style="background:${avColor(n)}" title="${n}">${n[0].toUpperCase()}</span>`;
const usersIcon='<svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17" cy="9" r="2.2"/><path d="M15.5 20a6 6 0 016-1.5"/></svg>';

// The teams I belong to (keyless rosters — role only).
const TEAMS=ORG.teams.filter(t=>t.members.includes(ME)).map((t,i)=>({id:'t'+i,name:t.name,members:t.members.slice(),roles:{...t.roles}}));
let SEL=TEAMS[0].id;
// Collections offered to a team (an org "attach", not crypto) — flatten the tree.
const layers='<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3.5 12L12 17l8.5-5M3.5 16L12 21l8.5-5"/></svg>';
const FLATC=[];(function rec(l){l.forEach(c=>{FLATC.push(c);if(c.children)rec(c.children);});})(COLL);
const offeredTo=name=>FLATC.filter(c=>c.offer&&c.offer.team===name);
// Discovery labels I've requested (shared source of truth with discover.html).
const REQ=new Set(ORG.myRequests);
function reqAccess(label){REQ.add(label);toast('Requested access to <b>'+label+'</b> — a member will grant you the key');render();}

const myRole=t=>t.roles[ME];
const adminsOf=t=>t.members.filter(m=>t.roles[m]==='admin').length;
// The model role is 'admin' (team_members.role); we label it "Manager" for users.
function roleBadge(r){return `<span class="role-badge role-${r}">${r==='admin'?'Manager':'Member'}</span>`;}
// Role dropdown — the ≥1-manager invariant locks demoting the last manager.
function roleSelect(t,m){const r=t.roles[m];const lock=r==='admin'&&adminsOf(t)<2;
  const opt=(v,l)=>`<option value="${v}" ${r===v?'selected':''}>${l}</option>`;
  return `<select class="inp" style="width:auto;padding:5px 9px" ${lock?'disabled title="a team needs at least one manager"':''} onchange="toast('${m} → '+this.value)">${opt('admin','Manager')}${opt('member','Member')}</select>`;}

function renderList(){
  document.getElementById('list').innerHTML=TEAMS.map(t=>`<div class="crow ${SEL===t.id?'on':''}" onclick="SEL='${t.id}';render()">
    <span style="color:var(--accent);display:grid;place-items:center">${usersIcon}</span>
    <span class="nm">${t.name}</span>
    ${myRole(t)==='admin'?'<span class="role-badge role-admin">Manager</span>':''}
    <span class="muted" style="font-size:12px;display:flex;align-items:center;gap:3px">${EXICON.users}${t.members.length}</span>
  </div>`).join('');
}

function detail(){
  const t=TEAMS.find(x=>x.id===SEL); const admin=myRole(t)==='admin';
  const head=`<div class="cmain-h"><span style="color:var(--accent);display:grid;place-items:center">${usersIcon}</span><h1>${t.name}</h1>${roleBadge(myRole(t))}
      <span class="muted" style="font-size:13px">· ${t.members.length} member${t.members.length===1?'':'s'}</span></div>`;
  const sub=admin
    ? `You're a <b>manager</b> of this team — add, remove, and set who's a manager. Sharing machines happens in collections.`
    : `You're a member of this team. A manager handles who's in it.`;

  const members=`<div class="panel" style="overflow:visible"><div class="panel-h"><span class="t">Members · ${t.members.length}</span></div>
    ${t.members.map(m=>{const r=t.roles[m];const isMe=m===ME;
      const you=isMe?' <span class="muted" style="font-size:12px">(you)</span>':'';
      const ctl=admin&&!isMe?`${roleSelect(t,m)}<button class="btn btn-ghost btn-sm" title="Remove from team" onclick="toast('Remove ${m}')" style="color:var(--red)">${EXICON.trash}</button>`:roleBadge(r);
      return `<div class="mrow">${av(m)}<span class="nm">${m}${you}</span>${ctl}</div>`;}).join('')}
    ${admin?`<div class="add-pick"><div class="ta"><input class="inp" placeholder="Add someone — type a username…" data-ex="${t.members.join(',')}" data-label="${t.name}" oninput="taSearch(this)"><div class="ta-menu" hidden></div></div></div>`:''}</div>`;

  // Collections offered to this team — discovery labels (not the real encrypted names),
  // visible to team members only. A non-member can request access; a member opens it.
  const offers=offeredTo(t.name);
  const discover=`<div class="panel"><div class="panel-h"><span class="t">Collections offered to this team · ${offers.length}</span></div>
    ${offers.length?offers.map(c=>{const mine=c.members.includes(ME);
      return `<div class="mrow"><span style="color:var(--accent);display:grid;place-items:center">${layers}</span>
        <span class="nm">${c.offer.label}</span>
        ${mine?'<span class="role-badge role-member">member</span><button class="btn btn-sm" onclick="location.href=\'collections.html\'">Open</button>'
              :REQ.has(c.offer.label)?'<span class="role-badge" style="background:color-mix(in oklab,var(--amber) 18%,transparent);color:var(--amber)">requested</span><button class="btn btn-sm" disabled style="opacity:.55;cursor:default">Awaiting a grant</button>'
              :`<button class="btn btn-primary btn-sm" onclick="reqAccess('${c.offer.label}')">Request access</button>`}</div>`;}).join('')
      :'<div class="mrow"><span class="muted" style="font-size:13px">No collections offered to this team yet. An owner can offer one from its collection settings.</span></div>'}</div>`;

  const zk=`<div class="zk"><span class="ic">${EXICON.shield}</span><div><b>Names here are for discovery, not secrets.</b> The labels above are visible to this team (and the server) so you can find and request access. The machines themselves — and every private collection — stay end-to-end encrypted; you only see them once a member grants you access.</div></div>`;

  // Leave (offboarding). A member can always leave; the last manager / sole member
  // can't (the team would be unmanageable or empty — that's the org-admin's call).
  const lastMgr=admin&&adminsOf(t)<2, sole=t.members.length<2, canLeave=!lastMgr&&!sole;
  const leave=`<div class="panel danger" style="padding:6px 18px 10px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0">
      <div><div style="font-weight:600;color:var(--red)">Leave team</div><div class="muted" style="font-size:12px">${canLeave
        ?"You leave the roster and stop seeing the collections offered to this team. Collections you're already a member of are unaffected."
        :(lastMgr?"You're the only manager — promote another manager first, or ask an admin."
                 :"You're the only member — an admin can delete the team.")}</div></div>
      <button class="btn btn-sm danger" style="color:var(--red)" ${canLeave?'':'disabled'} onclick="toast('Leave ${t.name}…')">Leave</button></div></div>`;

  return head+`<div class="cmain-sub">${sub}</div>`+members+discover+zk+leave;
}

// Typeahead: filter users by username prefix (in the real app this hits a directory
// search endpoint, so we never ship the whole user list). Excludes already-added.
function taSearch(inp){const q=inp.value.trim().toLowerCase();const menu=inp.nextElementSibling;
  const ex=(inp.dataset.ex||'').split(',').filter(Boolean);
  if(!q){menu.hidden=true;menu.innerHTML='';return;}
  const hits=ORG.users.map(u=>u.u).filter(u=>!ex.includes(u)&&u.toLowerCase().startsWith(q)).slice(0,8);
  menu.innerHTML=hits.length?hits.map(u=>`<div class="ta-item" data-u="${u}" data-label="${inp.dataset.label||''}" onclick="taPick(this)">${av(u)}<span>${u}</span></div>`).join('')
    :`<div class="ta-empty">No user starts with “${inp.value.trim()}”.</div>`;
  menu.hidden=false;}
function taPick(el){toast('Added '+el.dataset.u+' to '+el.dataset.label);const menu=el.parentElement;menu.hidden=true;const inp=menu.previousElementSibling;if(inp)inp.value='';}
document.addEventListener('click',e=>{if(!e.target.closest('.ta'))document.querySelectorAll('.ta-menu').forEach(m=>m.hidden=true);});

function render(){renderList();document.getElementById('detail').innerHTML=detail();}
function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}
render();
</script>
</body>
</html>
