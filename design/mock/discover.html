<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rite · Discover (mock)</title>
<link rel="stylesheet" href="rite.css">
<style>
  /* Discover: every collection OFFERED to a team I'm in, in one place. Discovery
     labels are server-readable & RBAC-gated (team members only) — NOT the encrypted
     names. I can request access; a key-holder grants (seals the itemsKey to me).
     See rite-teams-collections-unified + rite-account-reset memories. */
  .glyph{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#4d6fd0);display:grid;place-items:center;flex-shrink:0}
  .glyph svg{width:18px;height:18px;stroke:#0a0e1a;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .inst{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--card);font-weight:650}
  .inst .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 30px 60px}
  .hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .hero .badge{width:44px;height:44px;border-radius:13px;background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
  .hero .badge svg{width:24px;height:24px}
  .hero h1{font-size:24px;font-weight:750;letter-spacing:-.01em}
  .lead{color:var(--fg-dim);font-size:14px;margin:0 0 20px 58px}
  .zk{display:flex;gap:11px;align-items:flex-start;background:color-mix(in oklab,var(--accent) 8%,transparent);border:1px solid color-mix(in oklab,var(--accent) 25%,transparent);border-radius:12px;padding:13px 15px;margin-bottom:24px;font-size:13px;color:color-mix(in oklab,var(--fg) 82%,transparent)}
  .zk .ic{color:var(--accent);flex-shrink:0;margin-top:1px}
  .sec{margin-bottom:26px}
  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sec-h .tname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .sec-h .role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;background:color-mix(in oklab,var(--accent) 18%,transparent);color:var(--accent)}
  .sec-h .role.member{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
  .sec-h .cnt{color:var(--muted);font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ocard{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .ocard .top{display:flex;align-items:center;gap:11px}
  .ocard .ic{color:var(--accent);display:grid;place-items:center;flex-shrink:0}
  .ocard .label{font-weight:650;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ocard .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .ocard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .pill.member{background:color-mix(in oklab,var(--green) 16%,transparent);color:var(--green)}
  .pill.pending{background:color-mix(in oklab,var(--amber) 18%,transparent);color:var(--amber)}
  .empty{border:1px dashed var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border2);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:80;font-size:13px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .appbar{flex-wrap:wrap;row-gap:8px}
  @media (max-width:640px){ .wrap{padding:20px 16px 50px} .lead{margin-left:0} }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh">
  <div class="appbar">
    <div class="brand" style="display:flex;align-items:center;gap:10px">
      <div class="glyph"><svg viewBox="0 0 24 24"><path d="M4 6l6 6-6 6"/><path d="M13 18h7"/></svg></div>
      <span style="font-weight:750">Rite</span></div>
    <div class="inst"><span class="dot"></span><span>Acme Corp</span> <span class="muted" style="font-weight:400;font-size:12px">· rite.acme.io</span></div>
    <div class="spacer"></div>
    <button class="btn btn-sm" title="Your teams" onclick="location.href='teams.html'"><svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17" cy="9" r="2.2"/><path d="M15.5 20a6 6 0 016-1.5"/></svg> <span>Teams</span></button>
    <button class="btn btn-sm" title="Back to the app" onclick="location.href='web.html'"><svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> <span>Back to app</span></button>
  </div>
  <main style="flex:1"><div class="wrap" id="wrap"></div></main>
</div>
<div style="position:fixed;bottom:12px;right:14px;color:var(--muted);font-size:12px">Rite · <b>discover</b> · collections offered to your teams — request access, a member grants the key</div>
<script src="full-data.js"></script>
<script>
/* ================= Rite discover (user view, mock) ================= */
const ME=ORG.me;
const AV_COLORS=['#7c9cf5','#9ece6a','#e5b567','#f0a35e','#f7768e','#bb9af7','#56c7c0'];
const layers='<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3.5 12L12 17l8.5-5M3.5 16L12 21l8.5-5"/></svg>';
const usersIcon='<svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17" cy="9" r="2.2"/><path d="M15.5 20a6 6 0 016-1.5"/></svg>';
// The teams I'm in, and (flattened) every collection with a discovery offer.
const MYTEAMS=ORG.teams.filter(t=>t.members.includes(ME));
const FLATC=[];(function rec(l){l.forEach(c=>{FLATC.push(c);if(c.children)rec(c.children);});})(COLL);
const offeredTo=name=>FLATC.filter(c=>c.offer&&c.offer.team===name);
const REQ=new Set(ORG.myRequests); // discovery labels I've already requested

function card(c){
  const mine=c.members.includes(ME);
  const pending=REQ.has(c.offer.label);
  let foot;
  if(mine)foot=`<span class="pill member">Member</span><button class="btn btn-sm" onclick="location.href='web.html'">Open</button>`;
  else if(pending)foot=`<span class="pill pending">Requested</span><button class="btn btn-sm" disabled style="opacity:.55;cursor:default">Awaiting a grant</button>`;
  else foot=`<span class="muted" style="font-size:12px">Not a member</span><button class="btn btn-primary btn-sm" onclick="request('${c.offer.label}')">Request access</button>`;
  return `<div class="ocard">
    <div class="top"><span class="ic">${layers}</span><span class="label">${c.offer.label}</span></div>
    <div class="sub">${usersIcon} Offered to ${c.offer.team}${mine?' · you can open it':' · machines stay encrypted until granted'}</div>
    <div class="foot">${foot}</div></div>`;
}
function render(){
  document.getElementById('wrap').innerHTML=`
    <div class="hero"><span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>
      <div><h1>Discover</h1></div></div>
    <p class="lead">Collections offered to the teams you're in. Request access and a member grants you the key — the machines stay end-to-end encrypted until then.</p>
    <div class="zk"><span class="ic"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></span>
      <div><b>Labels here are for discovery, not secrets.</b> They're visible to members of the team (and the server) so you can find and request access. The real collection names, the machines and their credentials stay end-to-end encrypted — you only see them once a member grants you access.</div></div>
    ${MYTEAMS.map(t=>{const offers=offeredTo(t.name);const role=t.roles[ME]==='admin'?'Manager':'Member';
      return `<section class="sec">
        <div class="sec-h"><span class="tname">${usersIcon} ${t.name}</span><span class="role ${role==='Manager'?'':'member'}">${role}</span><span class="cnt">${offers.length} collection${offers.length===1?'':'s'} offered</span></div>
        ${offers.length?`<div class="cards">${offers.map(card).join('')}</div>`:`<div class="empty">No collections are offered to this team yet — an owner can offer one from its collection settings.</div>`}
      </section>`;}).join('')}`;
}
function request(label){REQ.add(label);toast('Requested access to <b>'+label+'</b> — a member will grant you the key');render();}
function toast(html){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.innerHTML=html;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
render();
</script>
</body>
</html>
