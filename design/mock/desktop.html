<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rite · desktop mock</title>
<link rel="stylesheet" href="rite.css">
<style>
  #ctxmenu{position:absolute;left:0;top:calc(100% + 8px);width:320px;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none;z-index:40}#ctxmenu.show{display:block}
  .side-hdr{display:flex;align-items:center;gap:4px;padding:4px 8px 6px 14px}
  .tnode{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .tnode:hover{background:var(--card2)} .tnode.sel{background:rgba(124,156,245,.13);border-color:rgba(124,156,245,.3)}
  .tnode .ca{width:15px;opacity:.55;display:grid;place-items:center;flex:none}
  .tnode .nm{flex:1;font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tnode.leaf .nm{font-weight:500}
  .tnode .acts{display:flex;gap:0;opacity:0}.tnode:hover .acts{opacity:1}.tnode .acts .btn{padding:3px}
  .mc{font-size:10px;font-weight:700;color:var(--purple);display:flex;align-items:center;gap:2px}
  .avs{display:flex}.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#0a0e1a;margin-left:-6px;border:2px solid var(--bg)}.av:first-child{margin-left:0}
  .collapsebar{display:flex;flex-direction:column;align-items:center;padding-top:10px}
  .menu{position:fixed;background:var(--card);border:1px solid var(--border2);border-radius:11px;box-shadow:var(--shadow);padding:6px;z-index:60;min-width:200px}.menu .row{padding:8px 10px}
  .chk{width:17px;height:17px;border:1.5px solid var(--border2);border-radius:5px;display:grid;place-items:center;flex:none}.chk.on{background:var(--accent);border-color:var(--accent);color:#0a0e1a}
  .mrow{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:8px;cursor:pointer}.mrow:hover{background:var(--card2)}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--border)}
  .toggle{width:40px;height:22px;border-radius:999px;background:var(--card2);border:1px solid var(--border2);position:relative;cursor:pointer}.toggle.on{background:var(--accent);border-color:var(--accent)}.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.toggle.on i{left:20px}
  .navtab{padding:8px 4px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}.navtab.on{color:var(--fg);border-color:var(--accent)}
  /* Health-check pastille (ADR 0017) — down is a calm hollow ring, not red. */
  .pst{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;box-sizing:border-box}
  .jhop{display:inline-grid;place-items:center;color:var(--fg-dim);opacity:.75;flex:none}.jhop .icon{width:14px;height:14px}
  .ccard .tgt .jhop{display:inline-grid;vertical-align:-2px;margin-left:3px}
  .pst.up{background:var(--green);box-shadow:0 0 5px color-mix(in oklab,var(--green) 60%,transparent)}
  .pst.down{background:transparent;border:1.5px solid var(--muted)}
  .pst.seen{background:color-mix(in oklab,var(--muted) 55%,transparent)}
  .pst.check{background:var(--amber);animation:pstPulse 1s ease-in-out infinite}
  @keyframes pstPulse{0%,100%{opacity:.35}50%{opacity:1}}
  .notif{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 2px var(--bg)}
  /* Discover overlay: boxed ZK note + collapsible team panels + clean cards (iso web). */
  .zk{display:flex;gap:11px;align-items:flex-start;background:color-mix(in oklab,var(--accent) 8%,transparent);border:1px solid color-mix(in oklab,var(--accent) 25%,transparent);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;line-height:1.5;color:color-mix(in oklab,var(--fg) 82%,transparent)}
  .zk .ic{color:var(--accent);flex-shrink:0;display:grid;place-items:center;margin-top:1px}.zk .ic .icon{width:18px;height:18px}
  .disc-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .disc-h{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;border-bottom:1px solid var(--border)}
  .disc-panel.collapsed .disc-h{border-bottom:none}
  .disc-h:hover{background:var(--card2)}
  .disc-h .tname{display:flex;align-items:center;gap:8px;flex:1;font-weight:650;font-size:14px}
  .disc-count{font-size:12px;color:var(--muted);font-weight:600;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
  .disc-chev{color:var(--muted);display:grid;place-items:center;transition:transform .15s}.disc-chev.open{transform:rotate(180deg)}
  .oc{display:flex;align-items:center;gap:13px;padding:12px 14px;border-bottom:1px solid var(--border)}.oc:last-child{border-bottom:none}
  .oc-ic{color:var(--accent);display:grid;place-items:center;flex-shrink:0}
  .oc-txt{flex:1;min-width:0}.oc-label{font-weight:600;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oc-sub{font-size:12px;color:var(--muted)}
  .oc-act{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .disc-empty{padding:14px;color:var(--muted);font-size:13px}
  /* main tabs + cards */
  #mtabs{display:flex;align-items:center;gap:4px;padding:4px 8px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
  .mtab{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;line-height:20px;font-weight:400;flex-shrink:0}
  .mtab svg{width:14px;height:14px}
  .mtab.on{background:color-mix(in oklab,var(--accent) 20%,transparent);color:var(--accent);font-weight:500}
  .mtab-act{display:grid;place-items:center;padding:2px;border-radius:4px;color:inherit;background:none;border:none;cursor:pointer;opacity:0;transition:opacity .1s;flex-shrink:0}
  .mtab:hover .mtab-act{opacity:1}
  .mtab-act:hover{background:rgba(255,255,255,.08)}
  .mtab-close:hover{background:rgba(247,118,142,.2);color:#f7768e}
  .mtab:not(.on):hover{background:var(--card2)}
  .mtab-new{display:flex;align-items:center;gap:2px;padding:6px 8px;border-radius:6px;color:var(--muted);background:none;border:none;cursor:pointer;flex-shrink:0}
  .mtab-new:hover{background:var(--card2);color:var(--fg)}
  .toolbar{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .cards.list{grid-template-columns:1fr;gap:8px}
  .ccard{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:14px;cursor:pointer;transition:.13s;position:relative}
  .ccard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .cards.list .ccard{display:flex;align-items:center;gap:12px;padding:11px 14px;transform:none}
  .ccard .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}.cards.list .ccard .h{margin:0}
  .ccard .nm{font-weight:650}.ccard .tgt{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .ccard .meta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:10px}.cards.list .ccard .meta{margin:0}
  .sel-input{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;color:var(--fg-dim);font-size:13px}
  .sel-input select{background:none;border:none;color:var(--fg);outline:none;font-size:13px}
  .curtag{font-size:10px;color:var(--accent);font-weight:700;margin-left:4px}
  #ctxmenu .row.cur{background:rgba(124,156,245,.12);box-shadow:inset 3px 0 0 var(--accent)}
  #ctxmenu .row{gap:8px}
  #ctxmenu .row .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ctxmenu .row .badge{width:28px;height:28px;border-radius:8px;font-size:12px}
  #ctxmenu .row .rmv{display:none;color:var(--red)}#ctxmenu .row:hover .rmv{display:inline-flex}
  #ctxmenu .row .btn{padding:4px;flex:none}
  .ctxmgr{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto}
  .mgr-wrap{max-width:820px;margin:0 auto;padding:40px 26px 70px}
  .mgr-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .mgr-card{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
  .mgr-card.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,156,245,.12)}
  .mgr-card .grow{flex:1;min-width:0}.mgr-card .nm{font-weight:650}.mgr-card .fl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}.sec .line{flex:1;height:1px;background:var(--border)}
  .dashed{border:1px dashed var(--border2);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:14px;font-weight:600;cursor:pointer}.dashed:hover{border-color:var(--accent);color:var(--fg)}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:9px;border:none;cursor:pointer;position:relative;transition:.1s}
  .sw:hover{transform:scale(1.08)} .sw.sel{outline:2px solid var(--fg);outline-offset:2px}
  .sw.sel::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#0a0e1a;font-weight:800;font-size:13px}
  /* modals must sit above the card-view overlay (z-index 70) + toast (80) */
  .backdrop{z-index:120}
  .modal .body{max-height:72vh;overflow:auto}
  textarea.inp{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;color:var(--fg);font-family:inherit;font-size:14px;resize:vertical}
  textarea.inp:focus{outline:none;border-color:var(--accent)}
  /* Focus mode (client/native only): the toolbar slides away so terminals fill the screen. Hover
     the top edge (or press F11/Esc) to reveal/exit — never traps the user (hint pill + hover-reveal). */
  body.focus .appbar{position:fixed;top:0;left:0;right:0;z-index:60;transform:translateY(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  body.focus.reveal .appbar{transform:translateY(0)}
  #focusHint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:61;display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
  body.focus #focusHint{display:flex;animation:focusHintFade 4s ease forwards}
  @keyframes focusHintFade{0%{opacity:0}10%{opacity:.96}70%{opacity:.96}100%{opacity:.2}}
  #focusHint kbd,.sc-tbl kbd{font:600 11px var(--mono);background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg)}
  /* Keyboard-shortcuts reference table (Settings, read-only) */
  .sc-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .sc-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border)}
  .sc-tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  .sc-tbl tr:last-child td{border-bottom:none}
  .sc-tbl td:nth-child(2){white-space:nowrap}
  .sc-tbl .d{color:var(--muted);font-size:12px}

  /* responsive: never overflow / overlap */
  .appbar{flex-wrap:nowrap}
  #acts{flex-wrap:nowrap;justify-content:flex-end;flex:none}
  .badge{flex:none}
  .ccard{min-width:0}.ccard .nm,.ccard .tgt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mgr-card{flex-wrap:wrap;row-gap:8px}.mgr-card .grow{min-width:140px}
  .toolbar{flex-wrap:wrap}
  .mrow{flex-wrap:wrap;row-gap:6px}
  @media (max-width:760px){ .lbl{display:none} .side{width:240px} }
  @media (max-width:560px){ .side{position:absolute;z-index:20;height:100%;box-shadow:var(--shadow)} }
</style>
</head>

function dlgCreatePassword(name,file){
  const bd=showModal({title:'Set the master password',subtitle:file,confirm:'Create & open',
    body:`<label class="field"><span>Master password</span><input class="inp" id="nv-pw" type="password" placeholder="Create a strong password"><div class="strength"><i id="nv-str"></i></div><div class="muted" style="font-size:11px;margin-top:5px">At least 12 characters — aim for 16+.</div></label>
      <label class="field"><span>Confirm master password</span><input class="inp" id="nv-pw2" type="password" placeholder="Repeat it"><div id="nv-match" style="font-size:11px;margin-top:5px;height:14px"></div></label>
      <p class="muted" style="font-size:12px;margin:2px 0 0">If you lose this password, the vault can't be decrypted — there's no recovery (zero-knowledge). The vault joins your list only once the password is set.</p>`,
    onConfirm:(m)=>{const pw=m.querySelector('#nv-pw').value,pw2=m.querySelector('#nv-pw2').value;
      if(pw.length<12||pw!==pw2)return false; // guarded by the disabled button too
      const nm=name||((file.split('/').pop()||'').replace(/\.db$/,''))||'Local vault';
      DATA.vaults.push({id:'v-'+Math.random().toString(36).slice(2,7),name:nm,file,badge:['v1','v2','v3'][DATA.vaults.length%3],locked:false});
      refreshCtx();toast(`Vault <span class="accent">${nm}</span> created`);}});
  // live validation (mirrors Rite's SetupScreen: length + match, disable until OK)
  const pw=bd.querySelector('#nv-pw'),pw2=bd.querySelector('#nv-pw2'),str=bd.querySelector('#nv-str'),match=bd.querySelector('#nv-match'),ok=bd.querySelector('[data-ok]');
  const upd=()=>{const v=pw.value;
    // Length-first (NIST 800-63B): 12 is the floor (orange), 16+ good (yellow), 20+ strong (green).
    const variety=(/[a-z]/.test(v)?1:0)+(/[A-Z]/.test(v)?1:0)+(/[0-9]/.test(v)?1:0)+(/[^A-Za-z0-9]/.test(v)?1:0);
    const valid=v.length>=12;
    str.style.width=Math.min(100,(v.length/20)*100)+'%';
    str.style.background=!v?'transparent':!valid?'#f7768e':(v.length>=20&&variety>=3?'#9ece6a':v.length>=16&&variety>=2?'#e0af68':'#ff9e64');
    const matched=!!pw2.value&&v===pw2.value;
    match.textContent=pw2.value?(matched?'✓ Passwords match':'✕ Passwords don’t match'):'';
    match.style.color=matched?'var(--green)':'var(--red)';
    const good=valid&&matched; ok.style.opacity=good?'1':'.45'; ok.style.pointerEvents=good?'':'none';};
  pw.addEventListener('input',upd);pw2.addEventListener('input',upd);upd();}

function tree(list,depth){let h='';list.forEach(n=>{
  if(n.type==='conn'){h+=connRow(n,depth);return;}
  const exp=n.open;
  h+=nodeRow(n,depth,exp);
  if(exp){ if(n.children)h+=tree(n.children,depth+1); (n.conns||[]).forEach(cn=>h+=connRow(cn,depth+1)); }
});return h;}
function nodeRow(n,depth,exp){const isColl=n.type==='coll';
  return `<div class="tnode ${STATE.selColl===n.id?'sel':''}" style="padding-left:${6+depth*15}px" onclick="${isColl?`openColl('${n.id}')`:`n_toggle('${n.id}')`}">

      ?`<button class="btn btn-ghost" title="Add" onclick="event.stopPropagation();collAdd('${n.id}',event)">${ICON.plus}</button><button class="btn btn-ghost" title="More" onclick="event.stopPropagation();collMore('${n.id}',event)">${EXICON.more}</button>`

function connRow(cn,depth){return `<div class="tnode leaf" style="padding-left:${6+depth*15}px" ondblclick="connectMachine('${cn.user||'user'}@${cn.host||cn.name}','${cn.name}')" onclick="toast('${cn.name} · double-click to open')">

    <span class="acts"><button class="btn btn-ghost" title="Open" onclick="event.stopPropagation();connectMachine('${cn.user||'user'}@${cn.host||cn.name}','${cn.name}')">${ICON.play}</button><button class="btn btn-ghost" title="Edit" onclick="event.stopPropagation();dlgNewConn('',${JSON.stringify(cn).replace(/"/g,'&quot;')})">${EXICON.more}</button></span></div>`;}

function paneGrid(){if(STATE.ctx.type==='home')return `<div class="pane-wrap focused">${termHTML(null)}</div>`;

  // the web UI's Terminal.tsx pane). Only the focused pane gets the blue ring.

function cardsView(coll){
  const sortF=list=>{const c=[...list];if(STATE.sort==='name')c.sort((a,b)=>a.name.localeCompare(b.name));if(STATE.sort==='host')c.sort((a,b)=>a.host.localeCompare(b.host));return c;};
  const card=cn=>`<div class="ccard" ondblclick="connectMachine('${cn.user||'user'}@${cn.host||cn.name}','${cn.name}')" onclick="toast('${cn.name} · double-click')">
    <div class="h"><span style="color:${cn.color||'var(--teal)'};display:grid;place-items:center">${M.machine}</span><span class="nm">${cn.name}</span>${pastille(cn)}<span style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" title="Move to folder…" style="padding:3px" onclick="event.stopPropagation();dlgMoveConn('${cn.name}',event)">${M.move}</button>
      <button class="btn btn-ghost btn-sm" title="Edit machine" style="padding:3px" onclick="event.stopPropagation();dlgNewConn('${coll.name}',${JSON.stringify(cn).replace(/"/g,'&quot;')})">${M.edit}</button>
      <button class="btn btn-ghost btn-sm" title="Connect" style="padding:3px" onclick="event.stopPropagation();connectMachine('${cn.user||'user'}@${cn.host||cn.name}','${cn.name}')">${ICON.play}</button></div>
    <div class="tgt">${cn.user}@${cn.host}:${cn.port}${cn.jump?`<span class="jhop" title="Reached through ${jumpChain(cn).join(' › ')} (ProxyJump)">${M.jump}</span>`:''}</div>
    <div class="meta"><span>⏱ ${cn.last}</span><span>${cn.jump?'via '+cn.jump:'ssh'}</span></div></div>`;
  const grid=list=>`<div class="cards ${STATE.layout}">${sortF(list).map(card).join('')}</div>`;
  const eyebrow=t=>`<div class="eyebrow" style="margin:2px 0 8px;color:var(--fg-dim)">${t}</div>`;
  // Drill-in: navigate the collection's curated FOLDERS one level at a time
  // (breadcrumb + tiles), instead of flattening every folder into a section.
  const cur=(STATE.collPath&&find(STATE.collPath))||coll;
  const chain=[];{let n=cur;while(n&&n.id!==coll.id){chain.unshift(n);n=parentOf(n.id);}}
  const crumb=`<div style="display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:6px;font-size:13px">
    <button class="btn btn-ghost btn-sm" style="padding:2px 6px;${cur.id===coll.id?'font-weight:650':'color:var(--muted)'}" onclick="collGo(null)">${EXICON.home} ${coll.name}</button>
    ${chain.map((f,i)=>{const last=i===chain.length-1;return `<span style="color:var(--muted)">▸</span><button class="btn btn-ghost btn-sm" style="padding:2px 6px;${last?'font-weight:650':'color:var(--muted)'}" ${last?'disabled':''} onclick="collGo('${f.id}')">${f.name}</button>`;}).join('')}</div>`;
  const tile=f=>`<div class="ccard" style="cursor:pointer" onclick="collGo('${f.id}')" title="Open “${f.name}”">
    <div class="h"><span style="color:${f.color||'var(--muted)'};display:grid;place-items:center">${M.folder}</span><span class="nm">${f.name}</span><span style="flex:1"></span><span class="cnt">${collectMachines(f).length}</span><span style="color:var(--muted);display:grid;place-items:center">${EXICON.chevR}</span></div></div>`;
  const subs=cur.children||[], here=cur.conns||[];

  if(!subs.length&&!here.length){body+=`<div style="border:1px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted)">${cur.id===coll.id?'No machines in this collection yet.':'This folder is empty.'}</div>`;}
  else{
    if(subs.length)body+=eyebrow('Folders')+`<div class="cards grid">${subs.map(tile).join('')}</div>`;
    if(here.length)body+=(subs.length?eyebrow('Machines'):'')+grid(here);
  }
  return `<div style="height:100%;display:flex;flex-direction:column;padding:12px">
    <div style="display:flex;align-items:center;gap:12px;padding-bottom:6px;min-height:38px">
      <span style="color:${coll.color||(coll.shared?'var(--purple)':'var(--accent)')}">${M.coll}</span><h2 style="font-size:18px">${coll.name}</h2>
      ${coll.shared?`<div class="avs">${coll.members.slice(0,4).map(av).join('')}</div>${STATE.showMemberCount?`<span class="muted" style="font-size:12px">${coll.members.length} members</span>`:''}`:'<span class="tag" style="background:var(--card2);color:var(--muted);border:1px solid var(--border)">Personal</span>'}
      <div style="flex:1"></div>
      <button class="btn btn-sm" onclick="openMemberPicker('${coll.id}')">${EXICON.users} ${coll.shared?'Members':'Share'}</button></div>
    <div class="toolbar">
      <div class="search" style="margin:0;flex:1;max-width:240px">${EXICON.search}<input placeholder="Filter…"></div>
      <div class="sel-input">${M.sort}<select onchange="STATE.sort=this.value;renderMain()"><option value="name" ${STATE.sort==='name'?'selected':''}>Name</option><option value="host" ${STATE.sort==='host'?'selected':''}>Host</option><option>Last used</option></select></div>
      <button class="btn btn-ghost btn-sm" title="Grid" onclick="STATE.layout='grid';renderMain()" style="${STATE.layout==='grid'?'color:var(--accent)':''}">${M.grid}</button>
      <button class="btn btn-ghost btn-sm" title="List" onclick="STATE.layout='list';renderMain()" style="${STATE.layout==='list'?'color:var(--accent)':''}">${M.list}</button>
      ${(STATE.hcMode==='on-demand'||STATE.hcMode==='full')?`<button class="btn btn-sm" title="Check machine status now" onclick="hcCheckNow()">${M.refresh} Check</button>`:''}
      <button class="btn btn-sm" title="Import ~/.ssh/config" onclick="dlgImportSSH('${coll.name}')">${M.import} Import</button>
      <button class="btn btn-sm" title="${cur.id===coll.id?'New shared folder':'New sub-folder in “'+cur.name+'”'}" onclick="dlgNewFolder('${cur.id}')">${M.folder} Folder</button>
      <button class="btn btn-primary btn-sm" onclick="dlgNewConn('${coll.name}')">${ICON.plus} Machine</button></div>
    <div class="scroll" style="flex:1">${body}</div></div>`;}
function openColl(id){STATE.selColl=id;STATE.collPath=null;STATE.mainTab='coll';renderSide();renderMain();}
function collGo(fid){STATE.collPath=fid;renderMain();}
function parentOf(id){let p=null;walk(LIB,n=>{(n.children||[]).forEach(c=>{if(c.id===id)p=n;});});return p;}
// Move a machine between folders of the open collection — pick a destination folder
// (or the collection root); it just re-parents the connection, no re-creation.
function dlgMoveConn(name,e){
  const coll=find(STATE.selColl);
  const dests=[{id:null,label:coll.name,depth:0}];
  (function rec(node,depth){(node.children||[]).forEach(f=>{dests.push({id:f.id,label:f.name,depth});rec(f,depth+1);});})(coll,1);
  const items=dests.map(d=>({icon:d.id?M.folder:M.coll,label:'&nbsp;'.repeat(d.depth*2)+d.label,onclick:()=>moveConnByName(name,d.id)}));
  items.push({icon:M.folder,label:'＋ New folder…',onclick:()=>dlgMoveNewFolder(name)});
  floatMenu(e,items);
}
function dlgMoveNewFolder(name){
  showModal({title:'New folder',subtitle:'Create it and move the machine in',confirm:'Create & move',
    body:`<label class="field"><span>Name</span><input class="inp" id="mvfname" placeholder="e.g. Web servers"></label>${swatchRow(COLORS[0])}`,
    onConfirm:(m)=>{const fname=(m.querySelector('#mvfname').value||'').trim()||'New folder';
      const coll=find(STATE.selColl);
      const node={id:'f-'+Math.random().toString(36).slice(2,7),type:'folder',color:__pickColor,name:fname,open:true,children:[],conns:[]};
      (coll.children=coll.children||[]).unshift(node);
      moveConnByName(name,node.id);}});
}
function moveConnByName(name,targetId){
  const coll=find(STATE.selColl);
  const cur=(STATE.collPath&&find(STATE.collPath))||coll;
  const i=(cur.conns||[]).findIndex(c=>c.name===name);if(i<0)return;
  const [cn]=cur.conns.splice(i,1);
  const target=targetId?find(targetId):coll;(target.conns=target.conns||[]).push(cn);
  toast(`Moved “${cn.name}” → ${target.name}`);renderMain();
}

/* ================= create menus + dialogs ================= */
function floatMenu(e,items){document.querySelectorAll('.menu').forEach(m=>m.remove());const m=document.createElement('div');m.className='menu';
  m.innerHTML=items.map((it,i)=>`<div class="row" data-i="${i}">${it.icon||''}<div class="grow"><div class="title" style="font-size:13px;font-weight:550">${it.label}</div></div></div>`).join('');
  document.body.appendChild(m);m.style.left=Math.min(e.clientX,innerWidth-220)+'px';m.style.top=Math.min(e.clientY,innerHeight-14-items.length*38)+'px';
  m.querySelectorAll('.row').forEach((r,i)=>r.onclick=()=>{m.remove();items[i].onclick();});
  setTimeout(()=>document.addEventListener('click',function h(){m.remove();document.removeEventListener('click',h);}),0);}
/* colour picker (folders & collections get a custom coloured icon) */
const COLORS=['#7c9cf5','#9ece6a','#e5b567','#f0a35e','#f7768e','#bb9af7','#56c7c0','#8b93a7'];
let __pickColor=COLORS[0];
function swatchRow(initial){__pickColor=initial||COLORS[0];
  return `<label class="field"><span>Colour</span><div class="swatches">${COLORS.map(c=>`<button type="button" class="sw ${c===__pickColor?'sel':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div></label>`;}
function pickColor(el,c){__pickColor=c;el.parentNode.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');}
/* is a node inside a collection? (→ its folders are SHARED with the collection) */
function underColl(id){let res=false;(function rec(list,inColl){for(const n of list){if(n.id===id){res=inColl;return;}if(n.children)rec(n.children,inColl||n.type==='coll');}})(LIB,false);return res;}
function collectMachines(node){let out=[...(node.conns||[])];(node.children||[]).forEach(c=>out=out.concat(collectMachines(c)));return out;}
function dlgNewFolder(parentId){const parent=parentId?find(parentId):null;
  const shared=!!parent&&(parent.type==='coll'||underColl(parentId));
  showModal({title:shared?'New folder in collection':'New folder',
    subtitle:parent?`inside “${parent.name}”${shared?' · shared with the collection':''}`:'Your personal organiser — colour it to spot it fast.',confirm:'Create',
    body:`<label class="field"><span>Name</span><input class="inp" id="fname" placeholder="${shared?'e.g. Web servers':'e.g. Client Beta'}"></label>${swatchRow(COLORS[0])}
      ${shared?`<p class="muted" style="font-size:12px;margin:8px 0 0">${EXICON.users} Part of the collection — everyone who has it sees this folder. Owners &amp; editors can change it (re-encrypts).</p>`:''}`,
    onConfirm:(m)=>{const name=(m.querySelector('#fname').value||'').trim()||'New folder';

/* SSH agent (native only): the client asks a running ssh-agent to sign the
   challenge — the private key and its passphrase never leave the agent, and Rite
   stores nothing. It is also the ONLY way to use hardware keys (YubiKey/FIDO).
   Mock state below drives both the detected panel and the graceful empty states. */
const AGENT={available:true,keys:[
  {name:'id_ed25519',type:'ed25519',fp:'SHA256:aB3k9…Qz',hw:false},
  {name:'YubiKey 5C',type:'sk-ssh-ed25519',fp:'SHA256:xY9m2…Lp',hw:true},
]};
function agentPanel(p,e){e=e||{};
  const abox='background:color-mix(in oklab,var(--accent) 8%,transparent);border:1px solid color-mix(in oklab,var(--accent) 25%,transparent);border-radius:12px;padding:12px 14px';
  const nbox='background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px';
  const mono='font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px';
  if(!AGENT.available)return `<div style="${nbox}">
    <div style="font-weight:600;margin-bottom:5px">⚠︎ No SSH agent detected</div>
    <p class="muted" style="font-size:12px;margin:0 0 7px">Rite couldn't reach an agent — <code style="${mono}">$SSH_AUTH_SOCK</code> is unset. Start one and add a key, then reopen this dialog:</p>
    <pre style="${mono};background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0;white-space:pre-wrap">eval "$(ssh-agent)"\nssh-add ~/.ssh/id_ed25519</pre></div>`;
  if(!AGENT.keys.length)return `<div style="${nbox}">
    <div style="font-weight:600;margin-bottom:5px">SSH agent running · no identities</div>
    <p class="muted" style="font-size:12px;margin:0">Add a key with <code style="${mono}">ssh-add ~/.ssh/id_ed25519</code>, then reopen this dialog.</p></div>`;
  return `
    <label class="field"><span>Identity</span>
      <select class="inp" id="${p}-agent-id">
        <option value="" ${!e.agentIdentity?'selected':''}>Offer all agent keys (default)</option>
        ${AGENT.keys.map(k=>`<option value="${k.fp}" ${e.agentIdentity===k.fp?'selected':''}>${k.name} · ${k.hw?'hardware · FIDO':k.type}</option>`).join('')}
      </select>
      <span class="muted" style="font-size:12px;display:block;margin-top:6px">Pin one to present only that key to the server (less fingerprint exposure). Default offers all, like <code style="${mono}">ssh</code>.</span>
    </label>
    <div style="${abox};margin-top:2px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:9px"><span style="color:var(--accent)">✓</span> SSH agent · ${AGENT.keys.length} ${AGENT.keys.length>1?'identities':'identity'} available</div>
      <div style="display:flex;flex-direction:column;gap:7px">${AGENT.keys.map(k=>`<div style="display:flex;align-items:center;gap:9px">
        <span style="color:var(--accent);display:grid;place-items:center;flex:none">${EXICON.key}</span>
        <span style="font-weight:600;font-size:13px">${k.name}</span>
        <span class="muted" style="${mono}">${k.fp}</span>
        <span style="margin-left:auto;flex:none;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;${k.hw?'background:color-mix(in oklab,var(--accent) 20%,transparent);color:var(--accent)':'background:var(--card2);color:var(--muted)'}">${k.hw?'hardware · FIDO':k.type}</span>
      </div>`).join('')}</div>
      <p class="muted" style="font-size:12px;line-height:1.55;margin:10px 0 0">Rite asks the agent to sign — your key and passphrase never leave it, and <b>nothing is stored in Rite</b>. Hardware keys (YubiKey/FIDO) work only this way.</p>
    </div>
    <label style="display:flex;gap:10px;align-items:flex-start;margin-top:11px;cursor:pointer">
      <input type="checkbox" id="${p}-agent-fwd" ${e.agentForward?'checked':''} style="margin-top:3px;flex:none">
      <span><b style="font-size:13px">Forward agent to this host</b><span class="muted" style="display:block;font-size:12px;line-height:1.5;margin-top:2px">⚠ Lets the remote machine reuse your local keys to hop onward (agent forwarding). Powerful but risky — a compromised host could use your agent. Leave off unless you need it.</span></span>
    </label>`;
}
/* Shared authentication section — one source of truth for New machine AND Quick
   SSH so they stay ISO (this is the future React <AuthSection> component). `p` is
   an id prefix ('nc' | 'qs'); `e` is the existing record for edit-mode prefill. */
function authSelect(p,e){e=e||{};const a=e.authType||'password';
  return `<select class="inp" id="${p}-auth" onchange="authToggle('${p}',this.value)"><option value="password" ${a==='password'?'selected':''}>Password</option><option value="publicKey" ${a==='publicKey'?'selected':''}>Public key (file)</option><option value="agent" ${a==='agent'?'selected':''}>SSH agent</option></select>`;}
function authPanels(p,e){e=e||{};const a=e.authType||'password';
  return `<div id="${p}-pw" style="${a==='password'?'':'display:none'}"><label class="field"><span>Password</span><input class="inp" type="password" placeholder="${e.name?'••••••••':'password'}"></label></div>
    <div id="${p}-key" style="${a==='publicKey'?'':'display:none'}"><label class="field"><span>Private key path</span><input class="inp" value="${e.keyPath||''}" placeholder="~/.ssh/id_ed25519"></label><label class="field"><span>Key passphrase (optional)</span><input class="inp" type="password" placeholder="if the key is encrypted"></label></div>
    <div id="${p}-agent" style="${a==='agent'?'':'display:none'}">${agentPanel(p,e)}</div>`;}
function authToggle(p,v){const pw=document.getElementById(p+'-pw'),k=document.getElementById(p+'-key'),ag=document.getElementById(p+'-agent');
  if(pw)pw.style.display=v==='password'?'':'none';
  if(k)k.style.display=v==='publicKey'?'':'none';
  if(ag)ag.style.display=v==='agent'?'':'none';}
function dlgNewConn(collName,existing){const e=existing||{};

  body:`<label class="field"><span>Name</span><input class="inp" id="nc-name" value="${e.name||''}" placeholder="Prod web"></label>
    <div style="display:flex;gap:10px"><label class="field" style="flex:1"><span>Protocol</span><select class="inp" id="nc-proto"><option ${e.protocol!=='SFTP'?'selected':''}>SSH</option><option ${e.protocol==='SFTP'?'selected':''}>SFTP</option></select></label>
      <label class="field" style="flex:2"><span>Host</span><input class="inp" id="nc-host" value="${e.host||''}" placeholder="10.0.0.5"></label>

    ${authPanels('nc',e)}

      <select class="inp" id="nc-jump"><option value="">Direct — no jump</option>${allColls().map(c=>{const opts=(c.conns||[]).filter(m=>m.name!==e.name).map(m=>`<option value="${m.name}" ${e.jump===m.name?'selected':''}>${m.name} — ${m.user?m.user+'@':''}${m.host}</option>`).join('');return opts?`<optgroup label="${c.name}">${opts}</optgroup>`:'';}).join('')}</select>
      <span class="muted" style="font-size:12px;display:block;margin-top:6px">Reach this machine <b>through</b> another (a bastion). Rite opens the jump first, then tunnels the SSH session to the target — like OpenSSH <code style="font-family:ui-monospace,monospace">ProxyJump</code>. <b>Chainable</b>: if the jump itself has a jump, the whole path is built. Your key is never copied onto the bastion — auth happens end-to-end with the target.</span></label>
    ${swatchRow(e.color||'#56c7c0')}
    <div style="display:flex;gap:10px;align-items:flex-end"><label class="field" style="flex:1"><span>Keep-alive</span><select class="inp" id="nc-ka" onchange="document.getElementById('nc-kai').style.display=this.value==='on'?'':'none'"><option value="off" ${e.sshKeepAliveOverride==='enabled'?'':'selected'}>Disabled</option><option value="on" ${e.sshKeepAliveOverride==='enabled'?'selected':''}>Enabled</option></select></label>
      <label class="field" id="nc-kai" style="flex:1;${e.sshKeepAliveOverride==='enabled'?'':'display:none'}"><span>Interval (s)</span><input class="inp" value="${e.sshKeepAliveInterval||30}"></label></div>
    <label class="field"><span>Health-check</span><select class="inp" id="nc-hc"><option value="inherit" ${e.hc===false?'':'selected'}>Follow the collection / server policy</option><option value="off" ${e.hc===false?'selected':''}>Never probe this machine</option></select>
      <span class="muted" style="font-size:12px;display:block;margin-top:6px">A machine can opt out of active probing; it can't opt into more than allowed.</span></label>
    <label class="field"><span>Pre-connect command <span class="muted" style="font-weight:400">(optional)</span></span><textarea class="inp mono" id="nc-preconnect" oninput="autoGrow(this)" placeholder="wg-quick up wg0&#10;# one line, or a mini-script (fail-fast)" spellcheck="false" rows="${e.preconnect?Math.min((e.preconnect.match(/\n/g)||[]).length+1,6):2}" style="resize:vertical;overflow:auto;min-height:52px;line-height:1.5">${e.preconnect||''}</textarea>
      <span class="muted" style="font-size:12px;display:block;margin-top:6px">A <b>local</b> command run <b>before</b> connecting — one line, or a few lines for a mini-script (<b>fail-fast</b>: any line failing aborts). <code style="font-family:ui-monospace,monospace">tailscale up</code>, <code style="font-family:ui-monospace,monospace">aws sso login</code>, <code style="font-family:ui-monospace,monospace">kinit</code>, mount a VPN… Interactive prompts (password, browser) run in a small terminal. If it fails, Rite <b>won't connect</b> and shows why. Runs on your machine, never on the server.</span></label>
    <label class="field"><span>Notes</span><textarea class="inp" id="nc-notes" rows="2" placeholder="Optional notes…">${e.notes||''}</textarea></label>

  onConfirm:(m)=>{const g=s=>m.querySelector(s);

    const rec={name:(g('#nc-name').value||'').trim()||'machine',protocol:g('#nc-proto').value,host:(g('#nc-host').value||'').trim(),port:Number(g('#nc-port').value)||22,user:(g('#nc-user').value||'').trim(),authType:_atype,agentIdentity:_atype==='agent'&&_aid?_aid.value:undefined,agentForward:_atype==='agent'&&_afwd?_afwd.checked:undefined,color:__pickColor,notes:(g('#nc-notes').value||'').trim(),sshKeepAliveOverride:g('#nc-ka').value==='on'?'enabled':'disabled',sshKeepAliveInterval:Number((g('#nc-kai').querySelector('input')||{}).value)||30,hc:g('#nc-hc').value==='off'?false:undefined,jump:(g('#nc-jump').value||'')||undefined,preconnect:(g('#nc-preconnect').value||'').trim()||undefined};

/* ================= member picker (collections, ADR 0016) ================= */
function roleSel(u,role,locked){return `<select class="inp" style="width:auto;padding:4px 7px;font-size:12px" ${locked?'disabled title="the collection needs at least one owner"':''} onclick="event.stopPropagation()" onchange="event.stopPropagation();mpRole('${u}',this.value)">
  ${['owner','editor','viewer'].map(r=>`<option value="${r}" ${r===role?'selected':''}>${r[0].toUpperCase()+r.slice(1)}</option>`).join('')}</select>`;}
function openMemberPicker(collId,isNew){const coll=collId?find(collId):{name:'',members:[ORG.me]};const chosen=new Set(coll.members);
  const roles=Object.assign({},coll.roles||{});chosen.forEach(u=>{if(!roles[u])roles[u]=u===ORG.me?'owner':'viewer';});if(!roles[ORG.me])roles[ORG.me]='owner';
  const folders=[];walk(LIB,n=>{if(n.type==='folder')folders.push(n.name);});
  const body=`${isNew?`<label class="field"><span>Name</span><input class="inp" placeholder="e.g. Production DBs"></label>${swatchRow(COLORS[4])}`:''}
    <div class="eyebrow" style="margin:2px 0 6px;color:var(--fg-dim)">Members · <span id="mpcount"></span></div>
    <div id="mpmembers" class="scroll" style="max-height:210px;overflow:auto;margin-bottom:12px"></div>
    <div style="display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap"><span class="muted" style="font-size:12px">Add from team:</span>
      ${ORG.teams.map(t=>`<span class="chip" style="cursor:pointer" onclick="mpTeam('${t.name}')">${EXICON.users} ${t.name} <span class="muted">${t.members.length}</span></span>`).join('')}</div>
    <div class="search" style="margin:0 0 6px">${EXICON.search}<input id="mpsearch" autocomplete="off" placeholder="Add someone — type a username…" oninput="mpResults()"></div>
    <div id="mpresults" style="margin-bottom:8px"></div>
    <label class="field"><span>Put in folder (your personal organisation — view only)</span><select class="inp"><option>(no folder)</option>${folders.map(f=>`<option>${f}</option>`).join('')}</select></label>
    <p class="muted" style="font-size:12px;margin:8px 0 0">${EXICON.key} Members hold the collection key. <b style="color:var(--fg-dim)">Owner</b> manages sharing &amp; settings (rename/delete/transfer) · <b style="color:var(--fg-dim)">Editor</b> adds/edits machines (re-encrypts) · <b style="color:var(--fg-dim)">Viewer</b> can only connect.</p>`;
  const bd=showModal({title:isNew?'New collection':`Share · ${coll.name}`,subtitle:`${chosen.size} member${chosen.size>1?'s':''}`,wide:true,body,confirm:isNew?'Create':'Save',
    onConfirm:()=>{if(isNew){const name=(bd.querySelector('input')?.value||'').trim()||'New collection';
        LIB.unshift({id:'c-'+Math.random().toString(36).slice(2,7),type:'coll',color:__pickColor,name,shared:chosen.size>1,members:[...chosen],roles:{...roles},open:false,conns:[]});
        renderSide();toast(`Collection <span class="accent">${name}</span> created · ${chosen.size} member${chosen.size>1?'s':''}`);}
      else{coll.members=[...chosen];coll.roles={...roles};renderSide();renderMain();toast('Sharing updated');}}});
  window.__mp={bd,chosen,roles};mpRenderMembers();}
// The chosen members — always shown, with role + remove. Adding is via the typeahead.
function mpRenderMembers(){const {bd,chosen,roles}=window.__mp;const owners=[...chosen].filter(u=>roles[u]==='owner');
  bd.querySelector('#mpmembers').innerHTML=[...chosen].map(u=>{const me=u===ORG.me;const lockOwner=roles[u]==='owner'&&owners.length<2;const info=ORG.users.find(x=>x.u===u)||{role:'user'};
    return `<div class="mrow" style="cursor:default">${av(u)}<div class="grow"><div class="title">${u}${roles[u]==='owner'?' <span title="owner">👑</span>':''}${me?' <span class="muted" style="font-size:12px">(you)</span>':''}</div><div class="sub">${info.role}</div></div>${roleSel(u,roles[u]||'viewer',lockOwner)}${me?'':`<button class="btn btn-ghost btn-sm" title="Remove" style="padding:4px;color:var(--red)" onclick="mpRemove('${u}')">${EXICON.trash}</button>`}</div>`;}).join('');
  const cnt=bd.querySelector('#mpcount');if(cnt)cnt.textContent=`${chosen.size} member${chosen.size>1?'s':''} · ${owners.length} owner${owners.length>1?'s':''}`;
  const p=bd.querySelector('header p');if(p)p.textContent=`${chosen.size} member${chosen.size>1?'s':''}`;}
// Typeahead: only search once you type a prefix — never ship the whole directory.
function mpResults(){const {bd,chosen}=window.__mp;const inp=bd.querySelector('#mpsearch');const q=(inp.value||'').trim().toLowerCase();const box=bd.querySelector('#mpresults');
  if(!q){box.innerHTML='';return;}
  const hits=ORG.users.filter(u=>!chosen.has(u.u)&&u.u.toLowerCase().startsWith(q)).slice(0,6);
  box.innerHTML=hits.length?`<div style="border:1px solid var(--border2);border-radius:10px;padding:4px">${hits.map(u=>`<div class="mrow" onclick="mpAdd('${u.u}')">${av(u.u)}<div class="grow"><div class="title">${u.u}</div><div class="sub">${u.role}</div></div><span class="muted" style="font-size:12px">Add</span></div>`).join('')}</div>`

/* Auto-grow a textarea: one line when empty, expands with content (capped). */

   (kinit password, aws sso browser) work and progress streams live. willFail
   drives the demo outcome: exit 0 → connect; non-zero → stay + Retry. */
function runPreconnect(willFail){const o=PRECONNECT;
  const lines=willFail
    ?['[#] ip link add wg0 type wireguard','RTNETLINK answers: Operation not permitted','Unable to access interface: Operation not permitted']
    :['[#] ip link add wg0 type wireguard','[#] wg setconf wg0 /dev/fd/63','[#] ip -4 address add 10.9.0.2/24 dev wg0','[#] ip link set mtu 1420 up dev wg0'];
  const base=`<span style="color:var(--accent)">$ ${o.cmd}</span>\n`;
  const bd=showModal({title:'Pre-connect',subtitle:`Runs on your machine before connecting to ${o.host}`,wide:true,confirm:'Cancel',
    body:`<div style="background:var(--bg);border:1px solid var(--border);border-radius:9px;overflow:hidden">
        <div style="padding:5px 11px;border-bottom:1px solid var(--border);font:600 11px ui-monospace,monospace;color:var(--muted);display:flex;align-items:center;gap:7px"><span class="pst check"></span> <span id="pc-hdr">pre-connect · running on your machine · interactive</span></div>
        <div id="pc-out" style="font-family:ui-monospace,monospace;font-size:12px;line-height:1.5;padding:10px 12px;white-space:pre-wrap;max-height:220px;overflow:auto;min-height:104px">${base}<span class="cursor"></span></div>
      </div>
      <p id="pc-note" class="muted" style="font-size:12px;margin:11px 0 0">Running… interactive prompts (a password, a browser) would appear right here.</p>`,
    onConfirm:()=>toast('Pre-connect cancelled — not connected')});
  const out=bd.querySelector('#pc-out'),hdr=bd.querySelector('#pc-hdr'),note=bd.querySelector('#pc-note'),okBtn=bd.querySelector('[data-ok]'),xBtn=bd.querySelector('[data-x]');
  xBtn.style.display='none'; // single abort button while running
  let shown=0;
  const render=tail=>{out.innerHTML=base+lines.slice(0,shown).join('\n')+(shown?'\n':'')+tail; out.scrollTop=out.scrollHeight;};
  const step=()=>{ if(!document.body.contains(bd))return;
    if(shown<lines.length){ shown++; render('<span class="cursor"></span>'); setTimeout(step,300); }
    else{ const dot=bd.querySelector('.pst'); if(dot)dot.className='pst '+(willFail?'down':'up');
      if(willFail){ render('<b style="color:var(--red)">✕ pre-connect failed (exit 1) — connection aborted.</b> <span class="cursor"></span>');
        hdr.textContent='pre-connect · failed'; note.innerHTML='<b>Nothing was opened.</b> Retry, or Cancel and edit the connection.';
        okBtn.textContent='⟳ Retry'; okBtn.onclick=()=>{bd.remove();runPreconnect(true);}; xBtn.style.display=''; xBtn.textContent='Close';
      }else{ render('<b style="color:var(--green)">✓ pre-connect succeeded — connecting…</b>');
        hdr.textContent='pre-connect · done'; note.textContent='The command succeeded — Rite is opening the session.';
        okBtn.textContent='Opening…'; okBtn.disabled=true;
        setTimeout(()=>{ if(document.body.contains(bd)){bd.remove(); toast('Opening SSH session…');} },850);
      } }
  };
  setTimeout(step,450);}

  ${STATE.ctx.type!=='home'?`<button class="btn btn-ghost btn-sm" title="Open in new window" onclick="openInNewWindow('${STATE.ctx.name}')">${EXICON.split}</button>`:''}`;}
// Profile dropdown (server context). Populated from the active server context on open.
function toggleProfile(e){e.stopPropagation();const a=document.getElementById('pmAv');a.textContent=(ORG.me||'?').slice(0,2).toUpperCase();a.style.background=avColor(ORG.me);document.getElementById('pmName').textContent=ORG.me;document.getElementById('pmServer').textContent=(STATE.ctx&&STATE.ctx.name)||'';document.getElementById('pmenu').classList.toggle('show');}
function closeProfile(){document.getElementById('pmenu').classList.remove('show');}
document.addEventListener('click',e=>{if(!e.target.closest('.profile')&&!e.target.closest('.pmenu'))closeProfile();});

/* ================= focus mode (client/native only) =================
   Hide the toolbar so terminals fill the screen. Toggle via the toolbar button or F11; exit via
   F11/Esc; hover the top edge to reveal the toolbar without leaving focus. Opt-in auto-collapse of
   the sidebar (Settings) for a terminals-only view. In the real client the shell also enters real
   OS fullscreen (tao set_fullscreen); here we best-effort the browser Fullscreen API for the demo. */
function toggleFocus(){
  STATE.focus=!STATE.focus;
  document.body.classList.toggle('focus',STATE.focus);
  if(STATE.focus){
    if(STATE.focusCollapseSidebar){STATE._sidePrev=STATE.sideCollapsed;STATE.sideCollapsed=true;}
    try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){/* fullscreen may be blocked (iframe/policy) — the toolbar-hide still applies */}
  }else{
    document.body.classList.remove('reveal');
    if(STATE.focusCollapseSidebar)STATE.sideCollapsed=STATE._sidePrev;
    try{if(document.exitFullscreen&&document.fullscreenElement)document.exitFullscreen();}catch(e){}
  }
  renderAll();
}
// Reveal the hidden toolbar while the cursor is near the top edge (hover-reveal, not an exit).
document.addEventListener('mousemove',e=>{if(STATE.focus)document.body.classList.toggle('reveal',e.clientY<=56);});
document.addEventListener('keydown',e=>{
  if(e.key==='F11'){e.preventDefault();toggleFocus();return;}
  if(e.key==='Escape'&&STATE.focus&&!document.querySelector('.backdrop')){e.preventDefault();toggleFocus();}
});
function renderAll(){renderPill();renderActs();renderSide();renderMain();}
STATE.ctx=Object.assign({type:'server'},DATA.servers[0]); // start on a server to show collections
renderAll();
</script>
