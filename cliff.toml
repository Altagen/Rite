# git-cliff configuration for RITE
# See: https://git-cliff.org/docs/configuration

[changelog]
# Template for the changelog header
header = """
# Changelog

All notable changes to RITE will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

# Template for the changelog body
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.id }}))\
          {% if commit.breaking %} [**BREAKING**]{% endif %}
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

# Remove the leading and trailing whitespace from the templates
trim = true

[git]
# Parse conventional commits
conventional_commits = true

# Protect breaking changes from being skipped
protect_breaking_commits = false

# Regex for parsing and grouping commits (with GitHub-style emojis)
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 2 -->📝 Documentation" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 4 -->♻️ Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->✅ Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  # Dependency work is shipped content, not noise: 0.2.1 was ENTIRELY dependency
  # updates and its generated notes came out with three lines in them, none of
  # which were the release. Grouped rather than skipped.
  #
  # Every prefix dependabot uses, not just `chore`: it raises GitHub Actions bumps
  # as `ci(deps)` and some ecosystems as `build(deps)`, and matched only on `chore`
  # those land in Miscellaneous — which is where the reader is not looking for them.
  { message = "^(chore|ci|build)\\(deps", group = "<!-- 7 -->📦 Dependencies" },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous" },
  { body = ".*security", group = "<!-- 8 -->🔒 Security" },
  { message = "^revert", group = "<!-- 9 -->⏪ Revert" },
]

# Filter out commits based on regex
filter_commits = true

# Regex for matching git tags
# NO 'v' prefix for RITE versions (0.1.0, not v0.1.0)
tag_pattern = "[0-9]+\\.[0-9]+\\.[0-9]+"

# Sort tags by version (not date)
sort_tags = "semver"

# Sort commits inside sections by oldest/newest order
sort_commits = "oldest"

# Limit the number of commits included in the changelog.
# limit_commits = 42
