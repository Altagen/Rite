[package]
name = "rite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "rite"

[[bin]]
name = "rite"
path = "src/main.rs"

[[bin]]
name = "check_db_path"
path = "src/bin/check_db_path.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Workspace packages
rite-core = { path = "../../../packages/rite-core" }
rite-crypto = { path = "../../../packages/crypto" }
rite-protocols = { path = "../../../packages/protocols" }

# Database
sqlx = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "6.0"

# Crypto (base64 for terminal I/O; argon2/zeroize/sha2 moved to rite-core)
base64 = "0.23"

# SSH (russh types surfaced through rite-core; async-trait for command glue)
russh = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.27"
