# Rite server — local evaluation.
#
#   docker compose -f deploy/compose.yml up
#   → http://127.0.0.1:1421
#
# No certificate, no proxy, nothing to install. The published port is bound to
# 127.0.0.1, so nothing here is reachable from the network.
#
# Nothing to prepare: the first visit offers **Create the server administrator**, and no
# secret rests anywhere. For a headless start with the administrator already created, add
# the override — `-f deploy/compose.bootstrap.yml` (see that file, and docs/SERVER.md).
#
# About RITE_ALLOW_INSECURE_HTTP: rite-server refuses to serve accounts over
# plaintext on a non-loopback address, and inside the container it binds
# 0.0.0.0 — which is not loopback as far as the process can tell. The flag
# acknowledges a plaintext hop that, with the `127.0.0.1:` publish below, never
# leaves this machine. Do not carry this file to a server; see compose.caddy.yml.
services:
  rite:
    # Override to test a build that is not released yet:
    #   RITE_IMAGE=localhost/rite-server:dev docker compose -f deploy/compose.yml up
    image: ${RITE_IMAGE:-ghcr.io/altagen/rite-server:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:1421:1421"
    environment:
      RITE_ACCOUNTS: "1"
      RITE_ADDR: "0.0.0.0:1421"
      RITE_ALLOW_INSECURE_HTTP: "1"
      # Instance settings as code (ADR 0020). With this, the container comes up
      # configured rather than merely administrable — no browser in the loop. Keys
      # declared here are locked: the console shows them, inert, naming this file.
      RITE_CONFIG: /etc/rite/rite.toml
    volumes:
      - ./rite.toml:/etc/rite/rite.toml:ro
      - rite-data:/home/rite/.local/share/rite

volumes:
  rite-data:
