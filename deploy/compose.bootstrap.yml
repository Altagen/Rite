# Create the administrator from a secret, instead of from a browser.
#
#   install -m 600 /dev/null deploy/admin_password.txt
#   printf '%s' 'a-strong-password' > deploy/admin_password.txt
#   docker compose -f deploy/compose.yml -f deploy/compose.bootstrap.yml up
#
# An OVERRIDE, and that is the whole point of this file. The bootstrap used to be wired
# into each deployment file, which made `deploy/admin_password.txt` a condition of
# starting at all: compose refuses to start when a secret's source is missing, so the
# documented way to decline the feature was to create the file empty. Nobody does that,
# and a default whose documentation says "create an empty file" is a wrong default.
#
# So the three deployment files ask for nothing, and this one adds the bootstrap to
# whichever of them you are using:
#
#   -f compose.yml       -f compose.bootstrap.yml     # local evaluation
#   -f compose.tls.yml   -f compose.bootstrap.yml     # HTTPS from rite-server itself
#   -f compose.caddy.yml -f compose.bootstrap.yml     # behind the proxy
#
# What it buys: the instance comes up with an administrator already created, so a headless
# deployment needs no browser in the loop (ADR 0020). What it costs: a live admin password
# at rest on this host until you empty the file. The server reads it at every start and
# only acts on it while no account exists — and it says so in its log when it finds one on
# an instance that already has accounts.
#
# Why a password and not a hash: the bootstrap derives the administrator's vault key from
# it (ADR 0011), so a hash would make an account that signs in and whose vault cannot
# exist. That is also why there is no way to do this without the server seeing the
# password once. See docs/SERVER.md.
services:
  rite:
    environment:
      RITE_ADMIN_USER: ${RITE_ADMIN_USER:-admin}
      RITE_ADMIN_PASSWORD_FILE: /run/secrets/rite_admin_password
    secrets:
      - rite_admin_password

secrets:
  rite_admin_password:
    file: ./admin_password.txt
