# Rite server — HTTPS from rite-server itself, with a certificate you provide.
#
#   docker compose -f deploy/compose.tls.yml up
#   → https://localhost:1421
#
# The two paths below are the only knob. Whatever produced the certificate — a
# self-signed pair from openssl, mkcert, or a real one from a CA — this file does
# not change. See docs/SERVER.md for the two ways to produce one locally and what
# each costs you in the browser.
#
# A self-signed certificate encrypts exactly as well as any other. What it does
# not do is prove anything to a browser, which is why mkcert exists: it installs
# a local authority so the certificate is genuinely trusted on this machine.
#
# Nothing to prepare: the first visit offers **Create the server administrator**, and no
# secret rests anywhere. For a headless start with the administrator already created, add
# the override — `-f deploy/compose.bootstrap.yml` (see that file, and docs/SERVER.md).
services:
  rite:
    image: ghcr.io/altagen/rite-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1421:1421"
    environment:
      RITE_ACCOUNTS: "1"
      RITE_ADDR: "0.0.0.0:1421"
      RITE_TLS_CERT: /etc/rite/tls/cert.pem
      RITE_TLS_KEY: /etc/rite/tls/key.pem
    volumes:
      - ./tls:/etc/rite/tls:ro
      - rite-data:/home/rite/.local/share/rite

volumes:
  rite-data:
