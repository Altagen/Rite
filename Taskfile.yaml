version: '3'

vars:
  VERSION:
    sh: grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\([0-9.]*\)".*/\1/'
  APP_NAME: rite
  DIST_DIR: ./dist
  FRONTEND_DIR: apps/desktop
  SERVER_IMAGE: rite-server:local

tasks:
  # Pre-push check — mirrors CI exactly
  check:
    desc: "Run all CI checks locally before pushing (fmt, clippy, tests, audit, typecheck)"
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code
      - cargo test --workspace --lib --all-features
      - cargo audit
      - pnpm --filter desktop typecheck

  # Development
  dev:
    desc: Run the native desktop client (wry) with rite-server in-process
    # Build the frontend and serve it from disk. Without RITE_WEB_DIR the binary
    # falls back to the copy embedded at compile time, which only `task build`
    # refreshes — so a plain `cargo run` silently serves whatever frontend was
    # last released, however old.
    cmds:
      - pnpm --filter desktop build:frontend
      - RITE_WEB_DIR="$PWD/apps/desktop/dist" cargo run -p rite-desktop

  dev:frontend:
    desc: Run the Vite dev server only (mock backend)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev:frontend

  dev:server:
    desc: Run rite-server standalone (serves the freshly built frontend + API)
    cmds:
      - pnpm --filter desktop build:frontend
      - RITE_WEB_DIR="$PWD/apps/desktop/dist" cargo run -p rite-server

  # Testing
  test:
    desc: Run all tests (Rust + TypeScript)
    cmds:
      - task: test-rust
      - task: test-ts

  test-rust:
    desc: Run Rust tests
    cmds:
      - cargo test --workspace --lib --all-features

  test-ts:
    desc: Run TypeScript type checking
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm typecheck

  e2e:
    desc: Run the Playwright end-to-end suite against a real rite-server
    cmds:
      - pnpm e2e

  # Linting
  lint:
    desc: Run all linters (Rust + TypeScript)
    cmds:
      - task: lint-rust
      - task: lint-ts

  lint-rust:
    desc: Run Rust linters (clippy + fmt check)
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code
      - cargo fmt --all -- --check

  lint-ts:
    desc: Run TypeScript linter
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm lint
      - pnpm typecheck

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt --all

  # Security audit
  audit:
    desc: Run security audit on dependencies
    cmds:
      - cargo audit

  # Build
  build:
    desc: Build the desktop client (release) with the frontend embedded
    cmds:
      - pnpm --filter desktop build:frontend
      - cp -r apps/desktop/dist/. packages/rite-server/web/
      - cargo build --release -p rite-desktop

  build-server-image:
    desc: Build the rite-server container image
    cmds:
      - '{{.CONTAINER_ENGINE | default "podman"}} build -f Containerfile.server -t {{.SERVER_IMAGE}} .'

  # SBOM
  sbom:
    desc: Generate a Software Bill of Materials (SBOM) for the client
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - |
        command -v cargo-cyclonedx >/dev/null 2>&1 || cargo install cargo-cyclonedx
        cargo cyclonedx --format json -p rite-desktop
        mv "$(find . -name 'rite-desktop*.cdx.json' | head -1)" {{.DIST_DIR}}/sbom.json
        echo "SBOM generated at {{.DIST_DIR}}/sbom.json"

  # Cleanup
  clean:
    desc: Clean all build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}}
      - rm -rf target
      - rm -rf {{.FRONTEND_DIR}}/dist
      - rm -rf {{.FRONTEND_DIR}}/node_modules/.vite

  clean-dist:
    desc: Clean distribution directory only
    cmds:
      - rm -rf {{.DIST_DIR}}

  # Changelog preview (git-cliff generates the real one in CI)
  changelog-preview:
    desc: Preview unreleased changes for the next release
    cmds:
      - |
        if ! command -v git-cliff >/dev/null 2>&1; then
          echo "git-cliff not installed: cargo install git-cliff"
          exit 1
        fi
        git-cliff --unreleased

  version:
    desc: Show current version
    cmds:
      - echo "{{.VERSION}}"

  default:
    desc: Show available tasks
    cmds:
      - task --list
