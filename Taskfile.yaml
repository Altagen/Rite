version: '3'

vars:
  VERSION:
    sh: grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\([0-9.]*\)".*/\1/'
  APP_NAME: rite
  DIST_DIR: ./dist
  FRONTEND_DIR: apps/desktop
  SERVER_IMAGE: rite-server:local

tasks:
  # Pre-push check — mirrors CI exactly
  check:
    desc: "Run all CI checks locally before pushing (fmt, clippy, tests, audits, typecheck, lint)"
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code
      # --lib skips the integration tests in tests/, which is where the SSH
      # transport and the pre-connect hook are covered. Run the lot.
      - cargo test --workspace --all-features
      # Both audits through the script, which fails when a check could not run rather
      # than reporting what it managed to ask. `cargo audit` alone exited 0 while ~170
      # yanked-crate checks errored out — see scripts/audit.sh.
      # The JS side was never audited at all before: four high advisories had
      # accumulated in a transitive dev dependency without anything reporting them.
      - sh scripts/audit.sh
      - pnpm --filter desktop typecheck
      - pnpm --filter desktop exec eslint src

  # Development
  dev:
    desc: Run the native desktop client (wry) with rite-server in-process
    # Build the frontend and serve it from disk. Without RITE_WEB_DIR the binary
    # falls back to the copy embedded at compile time, which only `task build`
    # refreshes — so a plain `cargo run` silently serves whatever frontend was
    # last released, however old.
    cmds:
      - pnpm --filter desktop build:frontend
      - RITE_WEB_DIR="$PWD/apps/desktop/dist" cargo run -p rite-desktop

  dev:frontend:
    desc: Run the Vite dev server only (mock backend)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev:frontend

  dev:server:
    desc: Run rite-server standalone (serves the freshly built frontend + API)
    cmds:
      - pnpm --filter desktop build:frontend
      - RITE_WEB_DIR="$PWD/apps/desktop/dist" cargo run -p rite-server

  # Testing
  test:
    desc: Run all tests (Rust + TypeScript)
    cmds:
      - task: test-rust
      - task: test-ts

  test-rust:
    desc: Run Rust tests
    cmds:
      - cargo test --workspace --lib --all-features

  test-ts:
    desc: Run TypeScript type checking
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm typecheck

  # Everything that needs a running server, in the order that makes it meaningful.
  # The two build steps are not politeness: Playwright serves apps/desktop/dist and the
  # checks drive target/debug/rite-server, and neither is rebuilt by the suites. A stale
  # one tests the previous commit and says "passed", which is the worst possible answer.
  # One script rather than a list of cmds here: `task` is not installed everywhere, and
  # the gate has to be runnable with nothing but a shell.
  e2e:
    desc: Run every end-to-end gate — builds, harness, standalone checks, then Playwright
    cmds:
      - sh e2e/gate.sh

  e2e:harness:
    desc: Bring up the SSH harness the e2e suite connects to (in a container, nothing on the host)
    cmds:
      - sh e2e/harness-up.sh

  e2e:play:
    desc: Playwright only — assumes the harness is up and the builds are current
    cmds:
      - pnpm e2e

  # Linting
  lint:
    desc: Run all linters (Rust + TypeScript)
    cmds:
      - task: lint-rust
      - task: lint-ts

  lint-rust:
    desc: Run Rust linters (clippy + fmt check)
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings -A dead_code
      - cargo fmt --all -- --check

  lint-ts:
    desc: Run TypeScript linter
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm lint
      - pnpm typecheck

  # The Playwright suite, in the image, on a machine that has neither the pinned
  # Node nor chromium's system libraries.
  #
  # This replaced a `lint-ts:iso` that existed only because the host was not on the
  # version that `.node-version` pins. The gate now refuses to run on the wrong Node
  # (e2e/gate.sh), so `task lint-ts` on the host already runs under the pin and the
  # container has nothing left to add there.
  #
  # Measured, not assumed: the whole suite — every project, 60 specs — passes here
  # in the same 1.8 minutes it takes on the host, and the host's node_modules comes
  # back with its mtime unchanged.
  #
  #   --network=host             the seven webServers in playwright.config.ts bind
  #                              127.0.0.1:1421-1427, and the SSH harness answers on
  #                              127.0.0.1:2222. e2e/serve.sh keeps each vault under
  #                              the container's own /tmp, so nothing of the host's
  #                              is read or written.
  #   ms-playwright, read-only   the image carries chromium's dependencies but not
  #                              chromium — ~500 MB a revision, for a suite GitHub CI
  #                              does not run yet. `npx playwright install chromium`
  #                              on the host fills the cache if it is empty.
  #   one volume per nm tree     the trees are symlink farms into `.pnpm`, so an
  #                              install under a different layout rewrites the host's
  #                              links. That is what used to kill the gate at step 1
  #                              with a pnpm purge error that read like a build break.
  #
  # Bring the harness up from the host first (`sh e2e/harness-up.sh`): that is podman
  # starting a container, and this is already inside one. Steps 2 and 5 of the gate
  # stay outside for that reason — never because of the browser.
  e2e:iso:
    desc: Run the Playwright suite in the ISO-CI container, under the pinned Node
    cmds:
      - |
        podman run --rm --network=host \
          -v "$PWD":/workspace:Z \
          -v rite-ci-nm-root:/workspace/node_modules \
          -v rite-ci-nm-desktop:/workspace/apps/desktop/node_modules \
          -v "$HOME/.cache/ms-playwright":/root/.cache/ms-playwright:ro \
          -w /workspace -e CI=true rite-ci:local \
          bash -lc 'pnpm install --frozen-lockfile && pnpm --filter desktop build:frontend && cargo build -p rite-server && pnpm e2e'

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt --all

  # Security audit
  audit:
    desc: Security audit of every dependency, Rust and JavaScript
    cmds:
      # Not `cargo audit` directly. The yanked-crate check needs a persistent registry
      # volume to run at all, and the script fails when it did not — see its header.
      - sh scripts/audit.sh

  # Build
  build:
    desc: Build the desktop client (release) with the frontend embedded
    cmds:
      - pnpm --filter desktop build:frontend
      - cp -r apps/desktop/dist/. packages/rite-server/web/
      - cargo build --release -p rite-desktop

  build-server-image:
    desc: Build the rite-server container image
    cmds:
      - '{{.CONTAINER_ENGINE | default "podman"}} build -f Containerfile.server -t {{.SERVER_IMAGE}} .'

  # SBOM
  sbom:
    desc: Generate a Software Bill of Materials (SBOM) for the client
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - |
        command -v cargo-cyclonedx >/dev/null 2>&1 || cargo install cargo-cyclonedx
        cargo cyclonedx --format json -p rite-desktop
        mv "$(find . -name 'rite-desktop*.cdx.json' | head -1)" {{.DIST_DIR}}/sbom.json
        echo "SBOM generated at {{.DIST_DIR}}/sbom.json"

  # Cleanup
  clean:
    desc: Clean all build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}}
      - rm -rf target
      - rm -rf {{.FRONTEND_DIR}}/dist
      - rm -rf {{.FRONTEND_DIR}}/node_modules/.vite

  clean-dist:
    desc: Clean distribution directory only
    cmds:
      - rm -rf {{.DIST_DIR}}

  # Changelog preview (git-cliff generates the real one in CI)
  changelog-preview:
    desc: Preview unreleased changes for the next release
    cmds:
      - |
        if ! command -v git-cliff >/dev/null 2>&1; then
          echo "git-cliff not installed: cargo install git-cliff"
          exit 1
        fi
        git-cliff --unreleased

  version:
    desc: Show current version
    cmds:
      - echo "{{.VERSION}}"

  default:
    desc: Show available tasks
    cmds:
      - task --list
