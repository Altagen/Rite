packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

overrides:
  ajv@<6.14.0: '>=6.14.0'
  # 4 high advisories, all transitive via commitlint → ajv (dev-only, never shipped).
  fast-uri@<3.1.6: '>=3.1.6'
  # 3 advisories on the brace-expansion 5 line, reached through minimatch 10 (glob,
  # itself a build-time dependency). The widest patch floor covers all three.
  brace-expansion@>=4.0.0 <5.0.12: '>=5.0.12'
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  js-yaml@>=4.0.0 <4.1.1: '>=4.1.1'
  minimatch@<3.1.3: '>=3.1.3'
  minimatch@<3.1.4: '>=3.1.4'
  minimatch@>=9.0.0 <9.0.6: '>=9.0.6'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  # Reached through postcss, which Vite pulls in to process the stylesheets.
  source-map-js@<1.2.2: '>=1.2.2'

# ADVISORIES WE ANSWER FOR RATHER THAN FIX. `overrides` above is the first answer and the
# better one: pull the patched version in. This is the other, for an advisory with no
# patched version to pull.
#
#   GHSA-fc5q-39xc-vjpf — ReDoS in picomatch <= 4.0.7, high. There is NO FIX: the advisory
#   names 4.0.8 and 4.0.7 is the newest version published. It reaches us only through
#   devDependencies (`@typescript-eslint` -> `tinyglobby` -> `picomatch`), so it is a glob
#   matcher running at lint time and in no shipped artefact — not the Rust server, not the
#   bundle. Allowed on 2026-11-18 so that one unfixable dev advisory does not disarm the
#   audit for everything else, which is what `--audit-level=high` would otherwise force us
#   to lower. REMOVE IT when 4.0.8 exists: `npm view picomatch version` answers that.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
