[workspace]
resolver = "2"
members = [
    "apps/desktop/shell",
    "packages/crypto",
    "packages/rite-core",
    "packages/rite-server",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
authors = ["Ange Cesari"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Altagen/Rite"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
age = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

# SSH
russh = "0.63"

# FTP (for future use)
suppaftp = "10.0"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    # `FromRow` is a derive, so it lives behind this feature even though we
    # never write a `query!`. Dropping it is what the explicit list is for:
    # sqlx's defaults also hand us the MySQL and Postgres drivers, which we
    # do not use and which drag a second, vulnerable `rsa` into the lockfile.
    "macros",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
