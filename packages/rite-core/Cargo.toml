[package]
name = "rite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace packages
rite-crypto = { path = "../crypto" }

# Async / errors / logging
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true }

# Crypto (auth module)
argon2 = { workspace = true }
zeroize = { workspace = true }
sha2 = "0.11"

# SSH + local PTY
russh = { workspace = true }
portable-pty = "0.9"

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
# Cross-process lock around the migration run. A SQLite transaction cannot serve as
# that lock: held open, it makes another process's connection setup fail outright.
fslock = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
async-trait = { workspace = true }
tempfile = "3.27"
# In-process russh server for the transport integration test (loopback SSH).
# Must match the rand_core russh/ssh-key use (0.10) so PrivateKey::random accepts our RNG.
rand = { version = "0.10", features = ["thread_rng"] }
