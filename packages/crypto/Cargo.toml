[package]
name = "rite-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true, features = ["alloc", "getrandom"] }
aes-gcm = "0.11"
base64 = "0.23"
dryoc = "2.0"
zeroize = { workspace = true }
serde = { workspace = true }
# No `serde_json` and no `thiserror`: declared when this crate was created in 2025-12 and
# never used by it — `cargo` 1.100's `unused_dependencies` lint is what finally said so.
# Errors here are `anyhow`, and nothing in this crate serialises to JSON itself.
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
